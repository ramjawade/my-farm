@if (!authService.initialized()) {
  <!-- Session restore in progress: avoid flashing the public layout -->
} @else if (authService.isLoggedIn()) {
  <a class="app-skip-link" href="#main-content" (click)="skipToContent($event)">{{
    'shell.skip' | translate
  }}</a>
  <div class="app-layout">
    <app-sidebar class="app-layout__sidebar" />
    <app-mobile-header class="app-layout__header" />
    <app-main class="app-layout__main" />
    <app-tab-bar class="app-layout__tabs" />
    <app-chat-bot-container />
  </div>
} @else {
  <router-outlet />
}
<lib-toast-outlet />
<lib-loader-outlet />
