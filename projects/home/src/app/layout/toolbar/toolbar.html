<header class="app-toolbar">
  <nav class="navbar navbar-light bg-light border-bottom px-3">
    <div class="container-fluid d-flex flex-nowrap justify-content-between align-items-center p-0">
      <!-- Left side: Toggle button (for mobile) and Brand Name -->
      <div class="d-flex align-items-center flex-shrink-0">
        <button
          type="button"
          class="btn btn-link text-decoration-none d-lg-none me-2 p-0 d-flex align-items-center justify-content-center rounded-3 hover-bg-light"
          [class.bg-success-subtle]="menuExpanded()"
          [class.text-success]="menuExpanded()"
          [class.text-secondary]="!menuExpanded()"
          style="width: 38px; height: 38px; font-size: 1.2rem"
          aria-label="Toggle navigation menu"
          [attr.aria-expanded]="menuExpanded()"
          (click)="onMenuClick()"
        >
          <i class="bi bi-layout-sidebar"></i>
        </button>
        <a
          routerLink="/"
          class="navbar-brand mb-0 fw-bold text-success d-flex align-items-center gap-1.5 text-decoration-none"
          style="cursor: pointer"
        >
          <i class="bi bi-tree-fill text-success"></i>
          <span>My Farm</span>
        </a>
      </div>

      <!-- Right side: Language Dropdown and User Avatar -->
      <div class="d-flex align-items-center gap-2 gap-sm-3 flex-shrink-0">
        <!-- Language switcher: not wired to any real translation yet (#141)
             -- disabled and labelled honestly rather than presented as a
             working picker. -->
        <div class="position-relative">
          <button
            type="button"
            class="btn btn-sm bg-white border border-light-subtle rounded-pill px-2 px-sm-3 py-1 text-xs fw-semibold text-secondary d-flex align-items-center gap-1 gap-sm-1.5 shadow-xs"
            style="height: 32px; opacity: 0.6; cursor: not-allowed"
            disabled
            title="Language switching is coming soon"
          >
            <i class="bi bi-translate text-success"></i>
            <span class="d-none d-sm-inline">Coming soon</span>
          </button>
        </div>

        <!-- User Avatar Dropdown -->
        <div class="position-relative">
          <button
            type="button"
            class="btn p-0 border-0 bg-transparent rounded-circle overflow-hidden shadow-sm hover-lift d-flex align-items-center justify-content-center"
            style="width: 36px; height: 36px"
            (click)="toggleUserDropdown(); $event.stopPropagation()"
          >
            <img
              [src]="avatarUrl()"
              alt="User Avatar"
              style="width: 100%; height: 100%; object-fit: cover"
              (error)="fallbackAvatar($event)"
            />
          </button>

          @if (userDropdownOpen()) {
            <div
              class="position-absolute end-0 mt-2 bg-white rounded-3 shadow-lg border border-light-subtle py-2 overflow-hidden animate-fade-in"
              style="
                min-width: 180px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08) !important;
                z-index: 1060;
              "
            >
              <!-- User Info header inside dropdown -->
              <div class="px-3 pb-2 mb-2 border-bottom">
                <div class="fw-bold text-dark text-sm">
                  {{ currentUser()?.fullName || 'Guest User' }}
                </div>
                <div class="text-xs text-muted">{{ currentUser()?.userRole || 'Farmer' }}</div>
              </div>

              <a
                routerLink="/profile"
                class="dropdown-item w-100 text-start px-3 py-2 fw-semibold text-xs border-0 bg-transparent transition hover-bg-light d-flex align-items-center gap-2 text-decoration-none text-dark"
              >
                <i class="bi bi-person-fill text-success"></i>
                <span>My Profile</span>
              </a>
              <button
                type="button"
                class="dropdown-item w-100 text-start px-3 py-2 fw-semibold text-xs border-0 bg-transparent transition hover-bg-light d-flex align-items-center gap-2"
              >
                <i class="bi bi-gear-fill text-success"></i>
                <span>Settings</span>
              </button>
              <div class="border-top my-1"></div>
              <button
                type="button"
                class="dropdown-item w-100 text-start px-3 py-2 fw-semibold text-xs border-0 bg-transparent text-danger transition hover-bg-light d-flex align-items-center gap-2"
                (click)="logout()"
              >
                <i class="bi bi-box-arrow-right"></i>
                <span>Logout</span>
              </button>
            </div>
          }
        </div>
      </div>
    </div>
  </nav>
</header>
