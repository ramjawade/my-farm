<aside class="app-sidebar" [class.open]="open()">
  <nav class="nav nav-pills flex-column p-3 gap-1">
    <a
      class="nav-link"
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="onNavClick()"
    >
      <i class="bi bi-house-door-fill me-2"></i>{{ 'sidebar.home' | translate }}
    </a>
    <a class="nav-link" routerLink="/map" routerLinkActive="active" (click)="onNavClick()">
      <i class="bi bi-map me-2"></i>{{ 'sidebar.lands' | translate }}
    </a>
    <a class="nav-link" routerLink="/crops" routerLinkActive="active" (click)="onNavClick()">
      <i class="bi bi-grid-3x3-gap-fill me-2"></i>{{ 'sidebar.crops' | translate }}
    </a>
    <a class="nav-link" routerLink="/activities" routerLinkActive="active" (click)="onNavClick()">
      <i class="bi bi-activity me-2"></i>{{ 'sidebar.activities' | translate }}
    </a>
    <a class="nav-link" routerLink="/weather" routerLinkActive="active" (click)="onNavClick()">
      <i class="bi bi-cloud-sun me-2"></i>{{ 'sidebar.weather' | translate }}
    </a>
    <a class="nav-link" routerLink="/reports" routerLinkActive="active" (click)="onNavClick()">
      <i class="bi bi-bar-chart-line-fill me-2"></i>{{ 'sidebar.reports' | translate }}
    </a>
    <a class="nav-link" routerLink="/profile" routerLinkActive="active" (click)="onNavClick()">
      <i class="bi bi-person-circle me-2"></i>{{ 'sidebar.profile' | translate }}
    </a>
  </nav>
</aside>
