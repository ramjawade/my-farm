<section class="chat-panel d-flex flex-column">
  <header class="chat-panel__header d-flex justify-content-between align-items-start gap-2 p-3 border-bottom">
    <div>
      <h2 class="h6 mb-1">
        <i class="bi bi-chat-dots me-1" aria-hidden="true"></i>
        {{ 'chatBot.title' | translate }}
      </h2>
      <p class="small text-muted mb-0">{{ 'chatBot.disclaimer' | translate }}</p>
    </div>
    <button
      type="button"
      class="btn-close"
      [attr.aria-label]="'chatBot.close' | translate"
      (click)="onClose()"
    ></button>
  </header>

  <div class="chat-panel__thread flex-grow-1 p-3" #thread role="log" aria-live="polite">
    @for (message of displayMessages(); track $index) {
      <div
        class="chat-panel__message d-flex mb-2"
        [class.justify-content-end]="message.role === 'farmer'"
        [class.chat-panel__message--past]="!isRecent($index)"
      >
        <div
          class="chat-panel__bubble p-2 px-3 rounded-3"
          [class.chat-panel__bubble--bot]="message.role === 'bot'"
          [class.chat-panel__bubble--farmer]="message.role === 'farmer'"
        >
          {{ message.text }}

          @if (message.chips?.length) {
            <div class="d-flex flex-wrap gap-2 mt-2">
              @for (chip of message.chips; track chip.value) {
                <button
                  type="button"
                  class="btn btn-sm btn-outline-primary rounded-pill"
                  (click)="onChipClick(chip)"
                >
                  {{ chip.label }}
                </button>
              }
            </div>
          }
        </div>
      </div>
    }
  </div>

  <form
    [formGroup]="form"
    (ngSubmit)="submit()"
    class="chat-panel__composer d-flex gap-2 p-3 border-top"
  >
    <label for="chatPanelInput" class="visually-hidden">
      {{ 'chatBot.inputLabel' | translate }}
    </label>
    <input
      id="chatPanelInput"
      type="text"
      class="form-control"
      formControlName="text"
      [placeholder]="'chatBot.placeholder' | translate"
      [disabled]="busy()"
    />
    <button type="submit" class="btn btn-primary" [disabled]="form.invalid || busy()">
      {{ 'chatBot.send' | translate }}
    </button>
  </form>
</section>
