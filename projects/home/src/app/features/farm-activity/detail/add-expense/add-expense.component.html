<form
  [formGroup]="expenseForm"
  (ngSubmit)="submit()"
  class="d-flex flex-column flex-grow-1 min-height-0 overflow-hidden"
>
  <div class="expense-modal-body">
    <div class="d-flex flex-column gap-3">
      <div class="row g-2">
        <!-- Category -->
        <div class="col-12 col-md-6">
          <label class="form-label required-label">{{ 'addExpense.category' | translate }}</label>
          <select class="form-select form-select-sm" formControlName="category">
            @for (cat of categoriesList(); track cat) {
              <option [value]="cat">{{ cat | referenceName: 'expense' }}</option>
            }
          </select>
        </div>

        <!-- Item Name -->
        <div class="col-12 col-md-6">
          <label class="form-label">{{ 'addExpense.itemServiceName' | translate }}</label>
          <input
            type="text"
            class="form-control form-control-sm"
            formControlName="itemId"
            [placeholder]="'addExpense.itemPlaceholder' | translate"
          />
        </div>
      </div>

      <div class="row g-2">
        <!-- Resource / Name -->
        <div class="col-12 col-md-6">
          <label class="form-label">{{ 'addExpense.vendorLaborer' | translate }}</label>
          <input
            type="text"
            class="form-control form-control-sm"
            formControlName="resourceId"
            [placeholder]="'addExpense.vendorPlaceholder' | translate"
          />
        </div>

        <!-- Remarks -->
        <div class="col-12 col-md-6">
          <label class="form-label">{{ 'addExpense.remarksNotes' | translate }}</label>
          <input
            type="text"
            class="form-control form-control-sm"
            formControlName="remarks"
            [placeholder]="'addExpense.remarksPlaceholder' | translate"
          />
        </div>
      </div>

      <div class="row g-2 align-items-end">
        <!-- Quantity -->
        <div class="col-4 col-md-2">
          <label class="form-label">{{ 'addExpense.qty' | translate }}</label>
          <input
            type="number"
            class="form-control form-control-sm"
            formControlName="quantity"
            placeholder="1"
          />
        </div>

        <!-- Unit -->
        <div class="col-4 col-md-3">
          <label class="form-label">{{ 'landEdit.unit' | translate }}</label>
          <input
            type="text"
            class="form-control form-control-sm"
            formControlName="unit"
            [placeholder]="'addExpense.unitPlaceholder' | translate"
          />
        </div>

        <!-- Rate -->
        <div class="col-4 col-md-3">
          <label class="form-label">{{ 'addExpense.rate' | translate }}</label>
          <input
            type="number"
            class="form-control form-control-sm"
            formControlName="rate"
            placeholder="500"
          />
        </div>

        <!-- Total Amount (Auto Calculated) -->
        <div class="col-12 col-md-4">
          <label class="form-label required-label">{{ 'addExpense.amount' | translate }}</label>
          <input
            type="number"
            class="form-control form-control-sm font-monospace fw-bold"
            formControlName="amount"
            [placeholder]="'addExpense.amountPlaceholder' | translate"
            [class.is-invalid]="
              expenseForm.get('amount')?.invalid && expenseForm.get('amount')?.touched
            "
          />
          @if (expenseForm.get('amount')?.invalid && expenseForm.get('amount')?.touched) {
            <div class="invalid-feedback">{{ 'addExpense.amountRequired' | translate }}</div>
          }
        </div>
      </div>
    </div>
  </div>

  <div class="d-flex justify-content-end gap-2 mt-4 pt-2 border-top">
    <button type="button" class="btn btn-secondary btn-sm" (click)="cancel()">
      {{ 'common.cancel' | translate }}
    </button>
    <button type="submit" class="btn btn-primary btn-sm">
      <i class="bi bi-check2-circle me-1"></i> {{ 'addExpense.addExpenseItem' | translate }}
    </button>
  </div>
</form>
