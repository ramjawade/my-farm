<div class="container-fluid py-4 px-3 px-md-4 d-flex flex-column gap-3">
  <header class="d-flex justify-content-between align-items-start gap-2">
    <div>
      <h1 class="h3 mb-1 fw-bold text-success">{{ 'reports.title' | translate }}</h1>
      <p class="text-body-secondary mb-0">{{ 'reports.subtitle' | translate }}</p>
    </div>
    @if (report().hasData) {
      <button
        type="button"
        class="btn btn-outline-success d-none d-md-inline-flex"
        data-testid="export-top"
        (click)="exportCSV()"
      >
        <i class="bi bi-download me-1" aria-hidden="true"></i>{{ 'reports.exportCsv' | translate }}
      </button>
    }
  </header>

  <app-season-filter [(season)]="selectedSeason" [(year)]="selectedYear" [years]="years()" />

  @if (report(); as r) {
    @if (r.hasData) {
      <app-season-summary [report]="r" />
      <div class="row g-3">
        <div class="col-12 col-lg-6">
          <app-crop-profit-list [crops]="r.crops" (open)="openCrop($event)" />
        </div>
        <div class="col-12 col-lg-6">
          <app-compare-seasons
            [names]="compareNames()"
            [selected]="compareCrop()"
            [rows]="compareRows()"
            (choose)="chooseCompareCrop($event)"
          />
        </div>
        <div class="col-12 col-lg-6">
          <app-expense-bars
            [heading]="'reports.byCategory'"
            [bars]="categoryBars()"
            [total]="r.totalExpense"
          />
        </div>
        <div class="col-12 col-lg-6">
          <app-expense-bars
            [heading]="'reports.byMonth'"
            [bars]="monthBars()"
            [total]="r.totalExpense"
          />
        </div>
      </div>
      <button
        type="button"
        class="btn btn-outline-success w-100 d-md-none"
        data-testid="export-bottom"
        (click)="exportCSV()"
      >
        <i class="bi bi-download me-1" aria-hidden="true"></i>{{ 'reports.exportCsv' | translate }}
      </button>
    } @else {
      <section class="card p-4 text-center" data-testid="reports-empty">
        <i class="bi bi-bar-chart-line fs-3 text-body-secondary" aria-hidden="true"></i>
        <p class="fw-semibold mb-1">{{ 'reports.emptyTitle' | translate }}</p>
        <p class="text-body-secondary small mb-0">
          {{ 'reports.emptyBody' | translate: { season: selectedSeason(), year: selectedYear() } }}
        </p>
      </section>
      <app-compare-seasons
        [names]="compareNames()"
        [selected]="compareCrop()"
        [rows]="compareRows()"
        (choose)="chooseCompareCrop($event)"
      />
    }
  }

</div>
