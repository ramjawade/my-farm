<div class="map-page h-100">
  <div class="map-page__wrapper">
    <!-- Saved Farms Panel -->
    @if (!isPicker) {
      <app-saved-farms
        [farms]="farms()"
        [selected]="selected()"
        (selectFarm)="onSelectFarm($event)"
        (renameFarm)="onRenameFarm($event.id, $event.newName)"
        (deleteFarm)="onDeleteFarm($event)"
        (updateNotes)="onUpdateFarmNotes($event.id, $event.notes)"
      />
    }

    @if (!isPicker || showSearch) {
      <app-map-search
        class="map-page__search"
        (resultSelected)="selectResult($event)"
        (searchCleared)="clearSearch()"
      />
    }

    @if (!isPicker) {
      <app-map-my-farm
        class="map-page__farm-draw"
        [hasFarms]="farms().length > 0"
        (setSatelliteLayer)="setLayer('satellite')"
        (locateMeRequest)="locateMeGPS()"
        (farmSaved)="onSaveFarm($event)"
      />
    }

    <div #mapContainer class="map-page__container" role="region" aria-label="Map"></div>
  </div>
</div>
