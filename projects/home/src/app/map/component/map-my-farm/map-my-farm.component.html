@if (draw.isDrawing()) {
  <div
    class="position-absolute top-0 start-50 translate-middle-x mt-2 px-3 py-2 rounded-3 border bg-body shadow-sm small text-nowrap pe-auto"
    role="status"
  >
    @if (draw.pointCount() > 0) {
      {{ 'lands.pointsHint' | translate: { count: draw.pointCount() } }}
    } @else {
      {{ 'lands.tapToAdd' | translate }}
    }
    @if (liveAcres() !== null) {
      <strong class="ms-2"
        >{{ liveAcres() | localNumber: '1.0-2' }} {{ 'landEdit.acres' | translate }}</strong
      >
    }
  </div>

  <div
    class="position-absolute bottom-0 start-50 translate-middle-x mb-4 d-flex align-items-center gap-2 pe-auto"
  >
    <button
      type="button"
      class="btn btn-secondary"
      [disabled]="draw.pointCount() === 0"
      (click)="undo()"
    >
      {{ 'landEdit.undo' | translate }}
    </button>
    <button type="button" class="btn btn-primary" [disabled]="!draw.canFinish()" (click)="finish()">
      {{ 'lands.finish' | translate }}
    </button>
    <button type="button" class="btn btn-secondary" (click)="cancel()">
      {{ 'landEdit.cancel' | translate }}
    </button>
    <button
      type="button"
      class="btn btn-secondary px-2"
      [disabled]="geolocating()"
      [attr.aria-label]="'mapMyFarm.locateMe' | translate"
      [title]="'mapMyFarm.locateMe' | translate"
      (click)="locateMe()"
    >
      <i class="bi bi-crosshair" aria-hidden="true"></i>
    </button>
  </div>
}
