@if (isOpen()) {
  <div class="confirm-scrim" (click)="onCancel()" aria-hidden="true"></div>
  <div class="confirm-layer">
    <div
      class="confirm-dialog"
      role="alertdialog"
      aria-modal="true"
      [attr.aria-labelledby]="titleId"
      [attr.aria-describedby]="messageId"
    >
      <div class="d-flex gap-3 align-items-start">
        <div class="confirm-icon" [class.confirm-icon--danger]="isDestructive()" aria-hidden="true">
          @if (isDestructive()) {
            <i class="bi bi-exclamation-triangle-fill"></i>
          } @else {
            <i class="bi bi-question-circle-fill"></i>
          }
        </div>
        <div class="flex-grow-1">
          <h2 class="confirm-title" [id]="titleId">{{ title() }}</h2>
          <p class="confirm-message" [id]="messageId">{{ message() }}</p>
        </div>
      </div>
      <div class="mf-action-row mt-4">
        <button
          #cancelBtn
          type="button"
          class="btn btn-secondary"
          (click)="onCancel()"
          (keydown.shift.tab)="wrapFocus($event, confirmBtn)"
        >
          {{ cancelText() }}
        </button>
        <button
          #confirmBtn
          type="button"
          class="btn"
          [class.btn-danger]="isDestructive()"
          [class.btn-primary]="!isDestructive()"
          (click)="onConfirm()"
          (keydown.tab)="wrapFocus($event, cancelBtn)"
        >
          {{ confirmText() }}
        </button>
      </div>
    </div>
  </div>
}
