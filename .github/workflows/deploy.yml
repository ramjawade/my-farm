name: Lint, Test, Build, and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_checks:
        description: 'Skip lint/format/test checks and deploy directly'
        type: boolean
        default: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    name: Lint, Test, Build
    if: ${{ !inputs.skip_checks }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run linter
        run: npm run lint

      - name: Run format check
        run: npm run format:check

      - name: Run unit tests
        run: npm run test

      - name: Build Angular Application
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: lint-test-build
    if: ${{ always() && (needs.lint-test-build.result == 'success' || needs.lint-test-build.result == 'skipped') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Stamp build metadata and secrets into the production environment
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          STAMP="$(date -u +%Y%m%d).${GITHUB_SHA::7}"
          sed -i "s|__BUILD_STAMP__|${STAMP}|" projects/home/src/environments/environment.prod.ts
          sed -i "s|__OPENWEATHER_API_KEY__|${OPENWEATHER_API_KEY}|" projects/home/src/environments/environment.prod.ts

      - name: Build production
        run: npm run build:prod

      - name: Add SPA fallback for GitHub Pages deep links
        run: cp dist/home/browser/index.html dist/home/browser/404.html

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/home/browser
          branch: gh-pages
