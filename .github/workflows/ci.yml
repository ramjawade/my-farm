name: CI

on:
  pull_request:
    # No branches filter — parent-epic sub-issue PRs target a parent
    # feature branch, not main, and still need this pipeline to run.
  workflow_dispatch:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    name: Lint, Format, Test, Build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run linter
        run: npm run lint

      - name: Run format check
        run: npm run format:check

      - name: Run unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Verify generated API contracts are up to date (#196)
        run: |
          npm run generate:contracts
          git diff --exit-code -- projects/home/src/app/core/api/contracts || {
            echo "::error::core/api/contracts is stale relative to projects/backend/openapi.json. Run 'npm run generate:contracts' and commit the result."
            exit 1
          }

  e2e:
    runs-on: ubuntu-latest
    name: E2E (Playwright golden path)

    # Same real Postgres as backend.yml — the golden path round-trips
    # through the actual API (ApiStorageService is online-only).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: myfarm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/myfarm_test
      FIREBASE_PROJECT_ID: myfarm-test
      CORS_ORIGINS: http://localhost:4200
      SESSION_JWT_SECRET: test-session-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: Install backend dependencies
        working-directory: projects/backend
        run: pip install -e ".[dev]"

      - name: Run backend migrations
        working-directory: projects/backend
        run: alembic upgrade head

      - name: Start backend
        working-directory: projects/backend
        run: |
          nohup uvicorn myfarm_api.main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 2
          done
          echo "::error::Backend did not become healthy in time"
          cat backend.log
          exit 1

      - name: Seed reference data
        run: curl -sf -X POST http://localhost:8000/api/v1/admin/seed-reference-data

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright golden-path suite
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload backend log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: projects/backend/backend.log
          retention-days: 7
