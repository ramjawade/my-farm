name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - 'projects/backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'projects/backend/**'
      - '.github/workflows/backend.yml'

defaults:
  run:
    working-directory: projects/backend

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    name: Ruff, mypy, pytest

    # A real Postgres, not SQLite — the whole point of testing the storage
    # layer is proving it against the database it will actually run on
    # (BACKEND_PLAN.md's "Previously-open items" table: test database).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: myfarm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/myfarm_test
      FIREBASE_PROJECT_ID: myfarm-test
      CORS_ORIGINS: https://ramjawade.github.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: mypy (strict)
        run: mypy myfarm_api tests

      - name: pytest
        run: pytest -q

  build-image:
    runs-on: ubuntu-latest
    name: Build container image
    needs: lint-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        # Proves the Dockerfile builds; pushing to a registry and deploying
        # to Render is wired once the Render service and its deploy hook
        # exist — see projects/backend/README.md.
        run: docker build -t myfarm-api:ci .
