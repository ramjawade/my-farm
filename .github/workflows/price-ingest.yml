name: Daily mandi price ingest

# Calls the backend's admin ingest once a day. Render's free instance sleeps, so
# the first request wakes it (about a minute); curl retries with a long timeout.
# A failed run shows as a red workflow run, which is the alert.

on:
  schedule:
    - cron: '30 14 * * *' # 20:00 IST, after most mandis have posted the day's prices
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    name: Ingest prices
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check the price feed is reachable from GitHub (no key sent)
        # Diagnostic only. HTTP 400 "Authorization field missing" means the feed answered,
        # so a failure of the next step is on the backend's side of the network.
        continue-on-error: true
        run: |
          curl --silent --show-error --max-time 30 \
            --write-out '\nhttp=%{http_code} connect=%{time_connect}s remote=%{remote_ip}\n' \
            "https://api.data.gov.in/resource/9ef84268-d588-465a-a308-a864a43d0070?format=json&limit=1" \
            || echo "curl exit code $?"

      - name: Call the ingest endpoint
        env:
          ADMIN_TOKEN: ${{ secrets.PRICE_INGEST_ADMIN_TOKEN }}
        run: |
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "PRICE_INGEST_ADMIN_TOKEN is not set" >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --max-time 300 --retry 3 --retry-delay 30 --retry-all-errors \
            -X POST \
            -H "X-Admin-Token: ${ADMIN_TOKEN}" \
            "https://myfarm-api.onrender.com/api/v1/admin/prices/ingest"
