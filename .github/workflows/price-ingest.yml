name: Daily mandi price ingest

# Fetches mandi prices from data.gov.in and posts them to the backend.
#
# The feed refuses connections from outside India (Render and GitHub's US runners are
# both refused), so this job runs on a SELF-HOSTED runner in India, labelled "india".
# A self-hosted runner executes this repository's workflow code on that machine, so it
# is triggered only by the schedule or by hand, never by pull requests. Keep the
# repository setting "Require approval for all outside collaborators" on.
#
# Safe to run more than once a day: the backend stores the same rows again as a no-op.
#
# The steps name no shell and call only `node`, so they run on the runner's default shell
# (PowerShell on Windows). The script reports whether the feed is reachable itself.

on:
  schedule:
    - cron: '30 14 * * *' # 20:00 IST, after most mandis have posted the day's prices
    - cron: '30 17 * * *' # 23:00 IST, a second chance if the machine was off earlier
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fetch from the feed and report, but post nothing to the backend'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: price-fetch
  cancel-in-progress: false

jobs:
  fetch:
    name: Fetch and post prices
    runs-on: [self-hosted, india]
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Check Node
        run: node --version

      - name: Fetch prices and post them to the backend
        env:
          ADMIN_TOKEN: ${{ secrets.PRICE_INGEST_ADMIN_TOKEN }}
          MANDI_API_KEY: ${{ secrets.MANDI_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: node scripts/fetch-mandi-prices.mjs
