<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#dcefdf" />
<title>MyFarm Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<!-- Prototype fonts + Mukta as the Devanagari fallback (Bricolage/Figtree have no Devanagari) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=Mukta:wght@400;500;600;700&display=swap" />
<style>
/* ===== Tokens: MyFarm design system (design/prototype/myfarm-prototype.html) ===== */
:root {
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:24px; --s-6:32px;
  --r-sm:8px; --r-md:10px; --r-lg:12px; --r-xl:14px; --r-sheet:18px; --r-pill:999px;
  --dur-base:.22s;
  --bg:#eef1ec; --surface:#ffffff; --surface2:#f4f6f2; --line:#dde3d8;
  --fg:#18231a; --muted:#5d6b5f;
  --leaf:#2f7a3f; --leaf-soft:#dcefdf; --leaf-ink:#1d5a2b;
  --sun:#c98a14; --sun-soft:#faefd2;
  --sky:#2b74b8; --sky-soft:#dcebf8;
  --rose:#b83d3d; --rose-soft:#f8dfdf;
  --shadow:0 12px 40px rgba(24,35,26,.14);
  --on-leaf:#fff;
  --display:'Bricolage Grotesque','Mukta','Segoe UI',system-ui,sans-serif;
  --body:'Figtree','Mukta','Segoe UI',system-ui,sans-serif;
  color-scheme: light;
}
/* Light by default; dark only via the toggle */
:root[data-theme="dark"] {
  --bg:#0f1611; --surface:#17211a; --surface2:#1d2a20; --line:#2a3a2d;
  --fg:#e8efe8; --muted:#9bab9d;
  --leaf:#5fbf72; --leaf-soft:#1f3a26; --leaf-ink:#a5e0b0;
  --sun:#e3a93a; --sun-soft:#3a2f14;
  --sky:#6aaee6; --sky-soft:#17304a;
  --rose:#e07878; --rose-soft:#3f2020;
  --shadow:0 12px 40px rgba(0,0,0,.5);
  --on-leaf:#0f1611;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { min-height: 100dvh; background: var(--bg); color: var(--fg); font: 500 16px/1.45 var(--body); -webkit-font-smoothing: antialiased; }
h1, h2 { font-family: var(--display); margin: 0; line-height: 1.15; text-wrap: balance; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--leaf); outline-offset: 2px; }
[hidden] { display: none !important; }

.app { min-height: 100dvh; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); }

/* ===== Hero: Warli line-art in leaf tones ===== */
.hero {
  position: relative; overflow: hidden;
  display: flex; flex-direction: column;
  padding: var(--s-6) 44px 0;
  background: radial-gradient(120% 80% at 85% 0%, var(--surface) 0%, transparent 55%), var(--leaf-soft);
  color: var(--leaf-ink);
}
.brand { display: flex; align-items: center; gap: var(--s-2); font: 700 22px var(--display); color: var(--leaf-ink); }
.brand svg { color: var(--leaf); }
.copy { margin: auto 0; padding: var(--s-5) 0; }
.copy h1 { font-size: clamp(2.4rem, 4.2vw, 3.5rem); font-weight: 700; color: var(--fg); }
.copy p { margin: var(--s-3) 0 var(--s-5); font-size: 1.15rem; color: var(--muted); max-width: 28rem; }
.chips { display: flex; flex-wrap: wrap; gap: var(--s-2); }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-pill); padding: 6px 14px; font-size: 14px; font-weight: 600; color: var(--leaf-ink); }
.chip svg { color: var(--leaf); }

.scene { display: block; width: calc(100% + 88px); margin: 0 -44px; height: auto; color: var(--leaf-ink); fill: currentColor; }
.scene .limb { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.scene .sun { color: var(--sun); }
.scene .crops { color: var(--leaf); }
.scene .rays { transform-box: fill-box; transform-origin: center; animation: turn 60s linear infinite; }
.scene .birds { animation: drift 7s ease-in-out infinite alternate; }
.scene .walk { animation: bob 1.6s ease-in-out infinite; }
.ground { height: var(--s-2); margin: 0 -44px; background: var(--leaf); opacity: .85; }

/* ===== Panel ===== */
.panel { display: flex; flex-direction: column; padding: var(--s-5) var(--s-6); }
.top { display: flex; justify-content: flex-end; align-items: center; gap: var(--s-2); }

/* .seg — segmented control from the prototype */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r-pill); background: var(--surface); padding: 3px; }
.seg button { border: 0; background: none; padding: 6px 14px; border-radius: var(--r-pill); color: var(--muted); font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--leaf); color: var(--on-leaf); }

/* .btn — buttons from the prototype */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-sm); padding: var(--s-2) var(--s-3); font-weight: 600; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2); }
.btn.lg { padding: var(--s-3) var(--s-4); }
.btn.p { background: var(--leaf); border-color: var(--leaf); color: var(--on-leaf); }
.btn.icon { width: 40px; height: 40px; padding: 0; color: var(--muted); }
.btn.block { width: 100%; min-height: 54px; font-size: 1.05rem; border-radius: var(--r-md); }
.btn:active { transform: translateY(1px); }

.body { flex: 1; display: grid; place-items: center; padding: var(--s-6) 0 var(--s-2); }
/* .card — card from the prototype */
.card { width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--s-5); box-shadow: var(--shadow); }

/* .steps — progress bars from the prototype */
.steps { display: flex; gap: var(--s-1); margin: 0 0 var(--s-4); }
.steps i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); transition: background var(--dur-base); }
.steps i.on { background: var(--leaf); }
.steps i.now { background: var(--sun); }

.card h2 { font-size: 26px; }
.sub { color: var(--muted); margin: var(--s-1) 0 var(--s-4); }
.sub b { color: var(--fg); white-space: nowrap; font-variant-numeric: tabular-nums; }
.link { border: 0; background: none; padding: 0; color: var(--leaf); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }

/* phone number field (prototype .fld input, scaled up for thumbs) */
.num { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-3) var(--s-4); border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); box-shadow: 0 0 0 3px var(--leaf-soft); border-color: var(--leaf); }
.num.bad { border-color: var(--rose); box-shadow: 0 0 0 3px var(--rose-soft); }
.cc { padding-right: var(--s-3); border-right: 1px solid var(--line); font-weight: 600; color: var(--muted); white-space: nowrap; }
.digits { display: flex; font: 700 26px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.digits span { position: relative; width: .62em; text-align: center; }
.digits span.empty { color: transparent; }
.digits span.empty::after, .digits span.cur::after { content: ''; position: absolute; left: 18%; right: 18%; bottom: .06em; height: 2px; border-radius: 2px; background: var(--line); }
.digits span.cur::after { background: var(--leaf); animation: blink 1s steps(1) infinite; }
.digits .gap { width: 10px; }

/* PIN dots */
.dots { display: flex; justify-content: center; gap: var(--s-3); padding: var(--s-2) 0 0; }
.dots span {
  width: 52px; height: 58px; border-radius: var(--r-md);
  border: 1px solid var(--line); background: var(--surface2);
  display: grid; place-items: center;
  font: 700 26px/1 var(--display); color: var(--fg);
  transition: background .15s, border-color .15s;
}
.dots span.on { background: var(--leaf-soft); border-color: var(--leaf); color: var(--leaf-ink); }
.dots span.cur { border-color: var(--leaf); box-shadow: 0 0 0 3px var(--leaf-soft); }
.dots.bad span { border-color: var(--rose); }
.eye { display: flex; align-items: center; gap: 6px; margin: var(--s-2) auto 0; border: 0; background: none; padding: 6px 10px; border-radius: var(--r-sm); color: var(--leaf); font-weight: 600; }
.eye:hover { background: var(--leaf-soft); }

/* keypad */
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s-2); margin-top: var(--s-4); }
.key {
  height: clamp(52px, 7vh, 60px);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface2);
  font: 700 24px/1 var(--display);
  transition: background .12s, transform .08s;
  -webkit-tap-highlight-color: transparent;
}
.key small { font: 500 12px/1 Mukta, sans-serif; color: var(--muted); margin-top: 3px; }
.key:hover { background: var(--leaf-soft); }
.key:active { transform: scale(.97); background: var(--leaf-soft); }
.key.del { background: none; border-color: transparent; color: var(--muted); }
.key.ok { background: var(--leaf); border-color: var(--leaf); color: var(--on-leaf); }
.key:disabled { opacity: .6; cursor: progress; }

/* name field (prototype .fld) */
.fld label { display: block; font-weight: 600; margin-bottom: 6px; }
.fld input { width: 100%; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: var(--r-md); padding: 14px 14px; font: 600 18px var(--body); outline: none; }
.fld input:focus { border-color: var(--leaf); box-shadow: 0 0 0 3px var(--leaf-soft); }
.fld input.bad { border-color: var(--rose); box-shadow: 0 0 0 3px var(--rose-soft); }
#nameForm .btn { margin-top: var(--s-4); }

/* .alert — from the prototype; rose variant for errors */
.alert { display: flex; gap: 10px; align-items: flex-start; background: var(--sun-soft); color: var(--fg); border-radius: var(--r-md); padding: var(--s-3); border: 1px solid var(--sun); margin-top: var(--s-3); font-size: 15px; }
.alert svg { color: var(--sun); flex: none; margin-top: 2px; }
.alert.rose { background: var(--rose-soft); border-color: var(--rose); color: var(--rose); font-weight: 600; }
.alert.rose svg { color: var(--rose); }

.done { text-align: center; padding: var(--s-2) 0 0; }
.tick { width: 84px; height: 84px; margin: 0 auto var(--s-4); border-radius: 50%; display: grid; place-items: center; background: var(--leaf-soft); color: var(--leaf); animation: pop .45s cubic-bezier(.2,1.6,.4,1); }

.safe { margin: var(--s-4) 0 0; display: flex; justify-content: center; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; }
.safe svg { color: var(--leaf); }
.demo { margin: var(--s-3) 0 0; text-align: center; font: 400 12px var(--body); color: var(--muted); }
.demo code { background: var(--surface2); border: 1px solid var(--line); padding: 1px 6px; border-radius: 6px; }

.spinner { width: 22px; height: 22px; border-radius: 50%; border: 3px solid currentColor; border-right-color: transparent; animation: turn .7s linear infinite; }
.shake { animation: shake .4s; }
.fade { animation: rise var(--dur-base) ease-out; }

@keyframes turn { to { transform: rotate(360deg); } }
@keyframes drift { to { transform: translateX(18px); } }
@keyframes bob { 50% { transform: translateY(-1.5px); } }
@keyframes blink { 50% { opacity: 0; } }
@keyframes shake { 20%,60% { transform: translateX(-7px); } 40%,80% { transform: translateX(7px); } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { transform: scale(.3); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ===== Phone: app-like, keypad pinned to the bottom ===== */
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .hero { padding: calc(var(--s-3) + env(safe-area-inset-top)) var(--s-4) 0; }
  .brand { font-size: 19px; }
  .copy { margin: 0; padding: var(--s-2) 0 0; }
  .copy h1 { font-size: 28px; }
  .copy p { font-size: 15px; margin: 2px 0 0; }
  .chips { display: none; }
  .scene, .ground { width: calc(100% + 32px); margin: 0 calc(-1 * var(--s-4)); }
  .scene { margin-top: -4px; }
  .ground { height: 6px; }

  .panel { padding: 0 var(--s-4) calc(var(--s-3) + env(safe-area-inset-bottom)); }
  .top { position: absolute; top: calc(var(--s-3) + env(safe-area-inset-top)); right: var(--s-4); }
  .top .seg button { padding: 4px 10px; font-size: 14px; }
  .top .btn.icon { display: none; }

  .body { padding: var(--s-4) 0 0; display: flex; }
  .card { flex: 1; max-width: none; display: flex; flex-direction: column; background: none; border: 0; border-radius: 0; padding: 0; box-shadow: none; }
  .card h2 { font-size: 22px; }
  .sub { margin: 2px 0 var(--s-3); font-size: 15px; }
  .num { padding: 10px var(--s-3); }
  .digits { font-size: 24px; }
  .alert { margin-top: 10px; padding: 10px; font-size: 14px; }
  .pad { margin-top: auto; padding-top: var(--s-3); }
  .key { background: var(--surface); }
  .safe { margin-top: 10px; font-size: 13px; }
  .demo { display: none; }
  .done { margin-top: var(--s-5); }
}
</style>
</head>
<body>
<div class="app">

  <!-- ===== Hero ===== -->
  <aside class="hero">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8.416.223a.5.5 0 0 0-.832 0l-3 4.5A.5.5 0 0 0 5 5.5h.098L3.076 8.735A.5.5 0 0 0 3.5 9.5h.191l-1.638 3.276a.5.5 0 0 0 .447.724H7V16h2v-2.5h4.5a.5.5 0 0 0 .447-.724L12.310 9.5h.191a.5.5 0 0 0 .424-.765L10.902 5.5H11a.5.5 0 0 0 .416-.777zM6.437 4.758A.5.5 0 0 0 6 4.5h-.066L8 1.401 10.066 4.5H10a.5.5 0 0 0-.424.765L11.598 8.5H11.5a.5.5 0 0 0-.447.724L12.69 12.5H3.309l1.638-3.276A.5.5 0 0 0 4.5 8.5h-.098l2.022-3.235a.5.5 0 0 0 .013-.507"/></svg>

    </div>

    <div class="copy">
      <h1 data-i18n="greet"></h1>
      <p data-i18n="tagline"></p>
      <div class="chips">
        <span class="chip"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M15.817.113A.5.5 0 0 1 16 .5v14a.5.5 0 0 1-.402.49l-5 1a.5.5 0 0 1-.196 0L5.5 15.01l-4.902.98A.5.5 0 0 1 0 15.5v-14a.5.5 0 0 1 .402-.49l5-1a.5.5 0 0 1 .196 0L10.5.99l4.902-.98a.5.5 0 0 1 .415.103M10 1.91l-4-.8v12.98l4 .8zm1 12.98 4-.8V1.11l-4 .8zm-6-.8V1.11l-4 .8v12.98z"/></svg><span data-i18n="f1"></span></span>
        <span class="chip"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M3 0h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2v-1h1v1a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1v1H1V2a2 2 0 0 1 2-2M1 5v-.5a.5.5 0 0 1 1 0V5h.5a.5.5 0 0 1 0 1h-2a.5.5 0 0 1 0-1zm0 3v-.5a.5.5 0 0 1 1 0V8h.5a.5.5 0 0 1 0 1h-2a.5.5 0 0 1 0-1zm0 3v-.5a.5.5 0 0 1 1 0v.5h.5a.5.5 0 0 1 0 1h-2a.5.5 0 0 1 0-1z"/></svg><span data-i18n="f2"></span></span>
        <span class="chip"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 3.06h2.726c1.22 0 2.12.575 2.325 1.724H4v1.051h5.051C8.855 7.001 8 7.558 6.788 7.558H4v1.317L8.437 14h2.11L6.095 8.884h.855c2.316-.018 3.465-1.476 3.688-3.049H12V4.784h-1.345c-.08-.778-.357-1.335-.793-1.732H12V2H4z"/></svg><span data-i18n="f3"></span></span>
        <span class="chip"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M7 8a3.5 3.5 0 0 1 3.5 3.555.5.5 0 0 0 .624.492A1.503 1.503 0 0 1 13 13.5a1.5 1.5 0 0 1-1.5 1.5H3a2 2 0 1 1 .1-3.998.5.5 0 0 0 .51-.375A3.5 3.5 0 0 1 7 8m4.473 3a4.5 4.5 0 0 0-8.72-.99A3 3 0 0 0 3 16h8.5a2.5 2.5 0 0 0 0-5zM10.5 1.5a.5.5 0 0 0-1 0v1a.5.5 0 0 0 1 0zm3.743 1.964a.5.5 0 1 0-.707-.707l-.708.707a.5.5 0 0 0 .708.708zm-7.779-.707a.5.5 0 0 0-.707.707l.707.708a.5.5 0 1 0 .708-.708zm1.734 3.374a2 2 0 1 1 3.296 2.198q.3.423.516.898a3 3 0 1 0-4.84-3.225q.529.017 1.028.129m4.484 4.074c.6.215 1.125.59 1.522 1.072a.5.5 0 0 0 .039-.742l-.707-.707a.5.5 0 0 0-.854.377M14.5 6.5a.5.5 0 0 0 0 1h1a.5.5 0 0 0 0-1z"/></svg><span data-i18n="f4"></span></span>
      </div>
    </div>

    <svg class="scene" viewBox="0 0 600 300" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
      <defs>

      <rect x="60" y="229" width="12" height="21"/>

      <g class="sun"><circle cx="547" cy="212" r="1.8"/><circle cx="551" cy="221" r="1.8"/><circle cx="546" cy="229" r="1.8"/><circle cx="553" cy="236" r="1.8"/><circle cx="549" cy="244" r="1.8"/></g>

      <path class="limb" d="M0 250H600"/>
      <rect class="crops" x="0" y="256" width="600" height="44" fill="url(#sprouts)"/>
    </svg>
    <div class="ground"></div>
  </aside>

  <!-- ===== Sign-in panel ===== -->
  <main class="panel">

  // Preview hooks: ?lang=hi&theme=dark&step=pin
  const q = new URLSearchParams(window.__PREVIEW || location.search);
  if (T[q.get('lang')]) document.querySelector(`.seg [data-lang="${q.get('lang')}"]`).click();
  if (q.get('theme')) root.dataset.theme = q.get('theme');
  icon();
  const st = q.get('step');
  if (st && st !== 'phone') {
    s.phone = '9876543210';
    if (st === 'pin') s.pin = '12';
    if (['name', 'create', 'confirm'].includes(st)) { s.isNew = true; s.phone = '9876543210'; }
    if (st === 'create') { s.name = 'Rajesh Patil'; s.newPin = '1'; }
    if (st === 'done') s.name = 'Rajesh Patil';
    if (TITLE[st] || st === 'done') s.step = st;
  }

  render();
})();
</script>
</body>
</html>
