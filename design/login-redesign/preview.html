<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Login Preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" />
<style>
/* Same page + device-frame styling as design/prototype/myfarm-prototype.html */
:root {
  --bg:#eef1ec; --surface:#ffffff; --line:#dde3d8; --fg:#18231a; --muted:#5d6b5f;
  --leaf:#2f7a3f; --shell:#d5dbd0; --shadow:0 12px 40px rgba(24,35,26,.14);
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Figtree','Segoe UI',system-ui,sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--body); }
.page { max-width: 1640px; margin: 0 auto; padding: 20px 16px 40px; }
.top { margin-bottom: 20px; }
.top h1 { font-family: var(--display); font-size: clamp(1.5rem, 3vw, 2rem); margin: 0; line-height: 1.1; }
.top p { margin: 4px 0 0; color: var(--muted); max-width: 70ch; }
.cap { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 28px 0 12px; font-weight: 600; }
.phones { display: flex; flex-wrap: wrap; gap: 28px; }
figure { margin: 0; }
figcaption { margin-top: 10px; font-weight: 600; text-align: center; }
figcaption small { display: block; color: var(--muted); font-weight: 400; }

.phone { --s: .7; width: calc(390px * var(--s) + 24px); height: calc(844px * var(--s) + 24px); background: var(--shell); border-radius: 44px; padding: 12px; box-shadow: var(--shadow); }
.phone .scr { width: 100%; height: 100%; border-radius: 34px; overflow: hidden; background: var(--bg); }
.phone iframe { width: 390px; height: 844px; border: 0; display: block; transform: scale(var(--s)); transform-origin: 0 0; }

.desk-wrap { overflow-x: auto; padding-bottom: 8px; }
.desk { --s: .66; width: calc(1366px * var(--s)); border-radius: 14px; background: var(--shell); box-shadow: var(--shadow); overflow: hidden; }
.chrome { height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 14px; }
.chrome i { width: 11px; height: 11px; border-radius: 50%; background: var(--line); display: block; }
.chrome .url { margin-left: 14px; flex: 1; max-width: 380px; background: var(--surface); color: var(--muted); border-radius: 6px; font-size: 12px; padding: 3px 10px; }
.desk .scr { height: calc(800px * var(--s)); overflow: hidden; background: var(--bg); }
.desk iframe { width: 1366px; height: 800px; border: 0; display: block; transform: scale(var(--s)); transform-origin: 0 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); padding: 3px; margin-top: 14px; }
.seg button { border: 0; background: none; padding: 6px 14px; border-radius: 999px; color: var(--muted); font: 500 14px var(--body); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--leaf); color: #fff; }
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <h1>MyFarm sign-in · two designs</h1>
    <p>Every screen is live. Demo: a number ending in 0 → new farmer · PIN 1234 signs in.</p>
    <div class="seg" role="group" aria-label="Design version">
      <button type="button" data-v="system" aria-pressed="true">A · Design system</button>
      <button type="button" data-v="warli" aria-pressed="false">B · Warli mud</button>
    </div>
    <p id="vdesc"></p>
  </div>

  <p class="cap">Phone</p>
  <div class="phones">
    <figure><div class="phone"><div class="scr"><iframe data-q="lang=mr&theme=light" title="Phone: mobile number"></iframe></div></div><figcaption>1 · Mobile number<small>मराठी</small></figcaption></figure>
    <figure><div class="phone"><div class="scr"><iframe data-q="lang=mr&theme=light&step=pin" title="Phone: PIN"></iframe></div></div><figcaption>2 · PIN<small>मराठी</small></figcaption></figure>
    <figure><div class="phone"><div class="scr"><iframe data-q="lang=hi&theme=light&step=name" title="Phone: new farmer"></iframe></div></div><figcaption>New farmer · name<small>हिंदी</small></figcaption></figure>
    <figure><div class="phone"><div class="scr"><iframe data-q="lang=mr&theme=dark&step=create" title="Phone: create PIN, dark"></iframe></div></div><figcaption>New farmer · create PIN<small>मराठी · dark</small></figcaption></figure>
  </div>

  <p class="cap">Desktop</p>
  <div class="desk-wrap">
    <div class="desk"><div class="chrome"><i></i><i></i><i></i><span class="url">myfarm.app/login</span></div><div class="scr"><iframe data-q="lang=mr&theme=light" title="Desktop view"></iframe></div></div>
  </div>
</div>

(() => {
  const DESC = {"system":"Prototype design-system tokens, fonts and components (seg, btn, card, steps, alert), with the Warli farm scene in leaf tones.","warli":"Warli folk-art palette: rice-white on red mud, turmeric and crop-green accents, Baloo 2 + Mukta fonts."};
  const END = '<' + '/script>';
  const decode = (id) => new TextDecoder().decode(Uint8Array.from(atob(document.getElementById(id).textContent.trim()), (c) => c.charCodeAt(0)));
  const SRC = { system: decode('src-system'), warli: decode('src-warli') };
  function show(v) {
    document.querySelectorAll('.seg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === v)));
    document.getElementById('vdesc').textContent = DESC[v];
    document.querySelectorAll('iframe[data-q]').forEach((f) => {
      f.srcdoc = SRC[v].replace('<head>', '<head><script>window.__PREVIEW=' + JSON.stringify(f.dataset.q) + END);
    });
  }
  document.querySelectorAll('.seg button').forEach((b) => b.addEventListener('click', () => show(b.dataset.v)));
  show('system');
})();
</script>
