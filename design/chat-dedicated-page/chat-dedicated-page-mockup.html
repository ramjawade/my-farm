<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Page Mockup</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">
<style>
  /* Same bubble colours as chat-panel.component.scss */
  body { background: #f1f3f2; }
  .desk { width: 760px; height: 480px; border: 1px solid #ccc; background: #fff; overflow: hidden; position: relative; }
  .side { width: 170px; background: #fafafa; }
  .bubble { max-width: 75%; }
  .bubble--bot { background: #e7f2ec; }
  .bubble--farmer { background: #2f6e4b; color: #fff; }
  .panel { background: #f7f5f1; }
  .overlay-panel { position: absolute; right: 12px; bottom: 12px; width: 280px; height: 330px; border-radius: 14px; box-shadow: 0 12px 28px rgba(0,0,0,.2); }
  .fab { position: absolute; right: 16px; bottom: 16px; width: 48px; height: 48px; }
  figure { margin: 0; }
  figcaption { max-width: 760px; }
</style>
</head>
<body>
<div class="container-fluid py-4">
  <h1 class="h4">Chat as a page and an overlay (UX preview)</h1>
  <p class="text-muted mb-4">A static mockup for review. The chat panel is the same as today. New parts are marked <span class="badge text-bg-warning">new</span>.</p>

  <div class="d-flex flex-column gap-4">

    <!-- 1. Overlay on another page -->
    <figure>
      <div class="desk d-flex">
        <nav class="side border-end p-2 small">
          <div class="nav nav-pills flex-column gap-1">
            <a class="nav-link"><i class="bi bi-house-door-fill me-2"></i>Home</a>
            <a class="nav-link active"><i class="bi bi-activity me-2"></i>Activities</a>
            <a class="nav-link"><i class="bi bi-chat-dots me-2"></i>Chat <span class="badge text-bg-warning">new</span></a>
            <a class="nav-link"><i class="bi bi-cloud-sun me-2"></i>Weather</a>
          </div>
        </nav>
        <main class="flex-grow-1 p-3 text-muted">Activities page content…</main>
        <section class="overlay-panel panel d-flex flex-column small">
          <header class="d-flex justify-content-between align-items-start p-2 border-bottom">
            <div class="fw-semibold"><i class="bi bi-chat-dots me-1"></i>My farm assistant</div>
            <div class="d-flex gap-2 align-items-center">
              <button class="btn btn-sm btn-link text-muted p-0"><i class="bi bi-trash"></i></button>
              <button class="btn btn-sm btn-link text-muted p-0" title="Open full page"><i class="bi bi-arrows-angle-expand"></i></button>
              <span class="badge text-bg-warning">new</span>
              <button class="btn-close btn-sm"></button>
            </div>
          </header>
          <div class="flex-grow-1 p-2">
            <div class="d-flex mb-2"><div class="bubble bubble--bot p-2 rounded-3">Which crop was this for?</div></div>
          </div>
          <div class="p-2 border-top"><input class="form-control form-control-sm" placeholder="Type a message"></div>
        </section>
      </div>
      <figcaption class="small text-muted mt-2"><strong>1. Overlay, as today.</strong> The floating button opens it on any page. The new expand button moves the same conversation to the full page.</figcaption>
    </figure>

    <!-- 2. Dedicated page -->
    <figure>
      <div class="desk d-flex">
        <nav class="side border-end p-2 small">
          <div class="nav nav-pills flex-column gap-1">
            <a class="nav-link"><i class="bi bi-house-door-fill me-2"></i>Home</a>
            <a class="nav-link"><i class="bi bi-activity me-2"></i>Activities</a>
            <a class="nav-link active"><i class="bi bi-chat-dots me-2"></i>Chat</a>
            <a class="nav-link"><i class="bi bi-cloud-sun me-2"></i>Weather</a>
          </div>
        </nav>
        <main class="flex-grow-1 p-3 d-flex">
          <section class="panel border rounded-3 flex-grow-1 d-flex flex-column">
            <header class="p-3 border-bottom d-flex justify-content-between">
              <div>
                <h2 class="h6 mb-1"><i class="bi bi-chat-dots me-1"></i>My farm assistant</h2>
                <p class="small text-muted mb-0">Ask about your farm or log an activity</p>
              </div>
              <button class="btn btn-sm btn-link text-muted p-0"><i class="bi bi-trash"></i></button>
            </header>
            <div class="flex-grow-1 p-3">
              <div class="text-center text-muted small mb-2">Today</div>
              <div class="d-flex mb-2"><div class="bubble bubble--bot p-2 px-3 rounded-3">Which crop was this for?</div></div>
              <div class="d-flex mb-2 justify-content-end"><div class="bubble bubble--farmer p-2 px-3 rounded-3">Wheat</div></div>
              <div class="d-flex mb-2"><div class="bubble bubble--bot p-2 px-3 rounded-3">Got it. <button class="btn btn-sm btn-success ms-2">Review &amp; Save</button></div></div>
            </div>
            <div class="p-3 border-top d-flex gap-2"><input class="form-control" placeholder="Type a message"><button class="btn btn-success"><i class="bi bi-send"></i></button></div>
          </section>
        </main>
      </div>
      <figcaption class="small text-muted mt-2"><strong>2. <code>/chat</code> page <span class="badge text-bg-warning">new</span>.</strong> Opened from the sidebar or the expand button. It is full height and continues the same thread. There is no floating button and no close button here: the farmer leaves through normal navigation.</figcaption>
    </figure>

  </div>
</div>
</body>
</html>
