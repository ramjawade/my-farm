<title>MyFarm Design System</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>

/* Layout: one app, two device frames (desktop sidebar app / phone with bottom tabs), each with its own navigation state */
:root{
  --bg:#eef1ec; --surface:#ffffff; --surface2:#f4f6f2; --line:#dde3d8;
  --fg:#18231a; --muted:#5d6b5f;
  --leaf:#2f7a3f; --leaf-soft:#dcefdf; --leaf-ink:#1d5a2b;
  --sun:#c98a14; --sun-soft:#faefd2;
  --sky:#2b74b8; --sky-soft:#dcebf8;
  --rose:#b83d3d; --rose-soft:#f8dfdf;
  --shell:#d5dbd0; --shadow:0 12px 40px rgba(24,35,26,.14);
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Figtree','Segoe UI',system-ui,sans-serif;
  --on-leaf:#fff; --on-rose:#fff; --on-sun:#18231a;
  --clay:#b5483a; --grape:#6a4aa0; --ember:#c4682a;
  --dim:rgba(0,0,0,.4); --dim-strong:rgba(0,0,0,.5);
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:24px; --s-6:32px;
  --r-xs:3px; --r-sm:8px; --r-md:10px; --r-lg:12px; --r-xl:14px; --r-sheet:18px; --r-pill:999px;
  --shadow-1:0 2px 8px rgba(0,0,0,.2); --shadow-2:0 6px 18px rgba(0,0,0,.25); --shadow-3:0 20px 50px rgba(0,0,0,.35);
  --z-float-dim:4; --z-float:5; --z-dim:7; --z-dialog:8; --z-toast:9;
  --dur-fast:.15s; --dur-base:.22s; --dur-glow:.9s; --ease:ease-out;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1611; --surface:#17211a; --surface2:#1d2a20; --line:#2a3a2d;
  --fg:#e8efe8; --muted:#9bab9d;
  --leaf:#5fbf72; --leaf-soft:#1f3a26; --leaf-ink:#a5e0b0;
  --sun:#e3a93a; --sun-soft:#3a2f14;
  --sky:#6aaee6; --sky-soft:#17304a;
  --rose:#e07878; --rose-soft:#3f2020;
  --shell:#0a0f0b; --on-leaf:#0f1611; --on-rose:#0f1611; --on-sun:#0f1611; --shadow:0 12px 40px rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1611; --surface:#17211a; --surface2:#1d2a20; --line:#2a3a2d;
  --fg:#e8efe8; --muted:#9bab9d;
  --leaf:#5fbf72; --leaf-soft:#1f3a26; --leaf-ink:#a5e0b0;
  --sun:#e3a93a; --sun-soft:#3a2f14;
  --sky:#6aaee6; --sky-soft:#17304a;
  --rose:#e07878; --rose-soft:#3f2020;
  --shell:#0a0f0b; --on-leaf:#0f1611; --on-rose:#0f1611; --on-sun:#0f1611; --shadow:0 12px 40px rgba(0,0,0,.5);
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}

.page{max-width:1640px;margin:0 auto;padding-inline:16px;padding-block:20px 40px}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between;margin-bottom:20px}
.top h1{font-family:var(--display);font-size:clamp(1.5rem,3vw,2rem);margin:0;line-height:1.1;text-wrap:balance}
.top p{margin:4px 0 0;color:var(--muted);max-width:60ch}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--surface);padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:var(--r-pill);color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--leaf);color:var(--on-leaf)}

.stage{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start;justify-content:center}
.col{min-width:0}
.col.d{flex:1 1 760px}
.col.m{flex:0 0 auto}
.stage[data-view="desktop"] .col.m,.stage[data-view="mobile"] .col.d{display:none}
.stage[data-view="mobile"]{justify-content:center}
.cap{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}

/* Device frames */
.desk-wrap{width:100%;position:relative}
.desk{width:1120px;height:720px;transform-origin:top left;border-radius:var(--r-xl);background:var(--shell);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.chrome{height:34px;display:flex;align-items:center;gap:var(--s-2);padding:0 14px;flex:none}
.chrome i{width:11px;height:11px;border-radius:50%;background:var(--line);display:block}
.chrome .url{margin-left:14px;flex:1;max-width:380px;background:var(--surface);color:var(--muted);border-radius:var(--r-sm);font-size:12px;padding:3px 10px}
.phone{width:372px;height:760px;background:var(--shell);border-radius:44px;padding:12px;box-shadow:var(--shadow)}
.phone .scr{height:100%;border-radius:34px;overflow:hidden;display:flex;flex-direction:column;background:var(--bg);position:relative}
.status{display:flex;justify-content:space-between;padding:10px 22px 4px;font-size:12px;font-weight:600;flex:none;background:var(--surface)}

/* App shell */
.app{position:relative;display:flex;flex:1;min-height:0;background:var(--bg)}
.side{width:204px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:var(--s-1)}
.brand{font-family:var(--display);font-weight:700;font-size:20px;display:flex;align-items:center;gap:var(--s-2);padding:0 8px 14px;color:var(--leaf-ink)}
.brand svg{color:var(--leaf)}
.nav{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:9px 10px;border-radius:var(--r-sm);color:var(--muted);font-weight:500;width:100%}
.nav:hover{background:var(--surface2)}
.nav[aria-current="page"]{background:var(--leaf-soft);color:var(--leaf-ink)}
.side .who{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px 8px;border-top:1px solid var(--line)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--sun-soft);color:var(--sun);display:grid;place-items:center;font-weight:700;flex:none}
.main{flex:1;min-width:0;overflow-y:auto;padding:var(--s-5) var(--s-5) var(--s-6)}
.mb .main{padding:var(--s-4) var(--s-4) 90px}
.tabs{display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px 14px;flex:none}
.tabs .nav{flex-direction:column;gap:var(--s-1);font-size:11px;padding:6px 2px;justify-content:center;align-items:center;text-align:center}
.fab{position:absolute;right:16px;bottom:84px;width:48px;height:48px;border-radius:50%;border:0;background:var(--leaf);color:var(--on-leaf);display:grid;place-items:center;box-shadow:var(--shadow-2)}

/* Content */
h2.pt{font-family:var(--display);font-size:24px;margin:0;line-height:1.15}
.mb h2.pt{font-size:21px}
.sub{color:var(--muted);margin:2px 0 0}
.head{flex-wrap:wrap;display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s-3);margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.card h3{font-family:var(--display);font-size:16px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:var(--s-2)}
.grid{display:grid;gap:var(--s-3)}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.mb .g4{grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s-3)}
.g2{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.mb .g2{grid-template-columns:minmax(0,1fr)}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.mb .g3{grid-template-columns:minmax(0,1fr)}
.stack>*+*{margin-top:var(--s-3)}
.kpi small{color:var(--muted);display:block;font-size:12px}
.kpi b{font-family:var(--display);font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums}
.mb .kpi b{font-size:20px}
.kpi span{font-size:12px;color:var(--muted)}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:var(--r-pill);background:var(--leaf-soft);color:var(--leaf-ink);white-space:nowrap}
.badge.sun{background:var(--sun-soft);color:var(--sun)}
.badge.sky{background:var(--sky-soft);color:var(--sky)}
.badge.rose{background:var(--rose-soft);color:var(--rose)}
.badge.mute{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
button.badge{border:0;cursor:pointer;font-family:inherit}
button.badge.mute{border:1px solid var(--line)}
.review{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin-bottom:24px}
.review .rh{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;margin-bottom:12px}
.review h2{font-family:var(--display);font-size:18px;margin:0}
.review .meter{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 220px;max-width:340px}
.review .meter .bar{flex:1}
.review .meter span{font-size:12px;color:var(--muted);white-space:nowrap}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.rc{border:1px solid var(--line);border-radius:var(--r-md);padding:10px;display:flex;flex-direction:column;gap:var(--s-2);min-width:0}
.rc.cur{border-color:var(--leaf)}
.rc .open{border:0;background:none;text-align:left;font-weight:600;padding:0;display:flex;justify-content:space-between;gap:var(--s-2);align-items:center}
.rc .seg{display:flex}
.rc .seg button{flex:1;padding:4px 4px;font-size:12px;white-space:nowrap}
.rdata{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}
.rnote{margin:10px 0 0;font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:var(--s-2) var(--s-3);font-weight:600;white-space:nowrap}
.btn.lg{padding:var(--s-3) var(--s-4)}
.btn.p{background:var(--leaf);border-color:var(--leaf);color:var(--on-leaf)}
.chips{display:flex;gap:var(--s-2);flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-pill);padding:4px 12px;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--leaf-soft);color:var(--leaf-ink);border-color:var(--leaf)}
.row{display:flex;gap:var(--s-3);align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .grow{flex:1;min-width:0}
.row .grow b{display:block}
.row small{color:var(--muted)}
.amt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.bar{height:8px;background:var(--surface2);border-radius:var(--r-pill);overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:var(--r-pill)}
.alert{display:flex;gap:10px;background:var(--sun-soft);color:var(--fg);border-radius:var(--r-md);padding:12px;border:1px solid var(--sun)}
.alert svg{color:var(--sun);flex:none}
.brief{background:var(--leaf-soft);border-color:transparent}
.brief h3{color:var(--leaf-ink)}
.brief p{margin:0 0 6px}
.crop{cursor:pointer;text-align:left;width:100%}
.crop[aria-pressed="true"]{border-color:var(--leaf);box-shadow:0 0 0 1px var(--leaf)}
.steps{display:flex;gap:var(--s-1);margin:10px 0 6px}
.steps i{flex:1;height:6px;border-radius:var(--r-xs);background:var(--line)}
.steps i.on{background:var(--leaf)}
.steps i.now{background:var(--sun)}
.stl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:16px}
.tl>div{position:relative;padding-bottom:14px}
.tl>div::before{content:"";position:absolute;left:-23px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--leaf);border:2px solid var(--surface)}
.tl>div.plan::before{background:var(--surface);border-color:var(--sun);outline:0}
.map{width:100%;height:auto;border-radius:var(--r-md);background:var(--surface2);display:block}
.map .land{cursor:pointer;vector-effect:non-scaling-stroke}
.map .land:hover{fill-opacity:.6!important}
.map text{font-weight:600;pointer-events:none;font-family:var(--body)}
.map-live{touch-action:none;cursor:grab;user-select:none}
.map-live.drawing{cursor:crosshair}
.mapbox{position:relative;border-radius:var(--r-md);overflow:hidden}
.mapbox .map{border-radius:0}
.msearch{position:absolute;top:10px;left:10px;display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-pill);padding:2px 4px 2px 12px;width:230px;max-width:calc(100% - 140px);box-shadow:var(--shadow-1)}
.msearch input{flex:1;min-width:0;border:0;background:none;color:var(--fg);font:inherit;padding:6px 0}
.msearch input:focus-visible{outline:none}
.msearch button,.ibtn{border:0;background:var(--surface);color:var(--fg);width:34px;height:34px;display:grid;place-items:center;padding:0;border-radius:50%}
.mtools{position:absolute;top:10px;right:10px;display:flex;gap:6px;align-items:flex-start}
.mtools .seg button{padding:5px 10px;font-size:12px}
.mtools .seg,.mtools .ibtn{box-shadow:var(--shadow-1)}
.mtools .ibtn{border:1px solid var(--line);border-radius:var(--r-md);width:34px;height:34px}
.mzoom{position:absolute;right:10px;bottom:28px;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--surface);box-shadow:var(--shadow-1)}
.mzoom .ibtn{border-radius:0;width:36px;height:36px}
.mzoom .ibtn+.ibtn{border-top:1px solid var(--line)}
.mapbox.mob .msearch{width:min(320px,calc(100% - 66px));max-width:none}
.mapbox.mob .mzoom{bottom:10px}
.flow{display:flex;gap:var(--s-2);align-items:center;flex-wrap:wrap;margin:0 4px 8px}
.fld{display:flex;flex-direction:column;gap:var(--s-1);margin-bottom:10px}
.fld label{font-size:12px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:var(--r-sm);padding:8px 10px;font:inherit;min-width:0;width:100%}
.fld .err{color:var(--rose);font-size:12px}
.req::after{content:" *";color:var(--rose)}
.frow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 var(--s-4)}
.mb .frow{grid-template-columns:minmax(0,1fr)}
.rad{display:flex;gap:var(--s-2) var(--s-4);flex-wrap:wrap}
.rad label{display:flex;gap:6px;align-items:center;font-size:14px;font-weight:500;color:var(--fg)}
.rad input{width:auto}
.areabox{background:var(--surface2);border-radius:var(--r-sm);padding:8px 10px;font-weight:600;font-variant-numeric:tabular-nums}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;z-index:var(--z-toast);max-width:calc(100% - 32px);width:max-content;padding:10px 14px;border-radius:var(--r-md);font-size:13px;font-weight:500;box-shadow:var(--shadow-2);background:var(--leaf-soft);color:var(--leaf-ink);border:1px solid var(--leaf)}
.toast.warn{background:var(--sun-soft);color:var(--fg);border-color:var(--sun)}
.mb .toast{bottom:88px}
.row.sel{background:var(--leaf-soft);border-radius:var(--r-md);box-shadow:inset 0 0 0 1px var(--leaf);padding-inline:10px;margin-inline:-10px;border-top-color:transparent}
.row.sel+.row{border-top-color:transparent}
@media (prefers-reduced-motion:no-preference){.row.pulse{animation:selglow var(--dur-glow) var(--ease)}@keyframes selglow{from{box-shadow:inset 0 0 0 1px var(--leaf),0 0 0 7px color-mix(in srgb,var(--leaf) 30%,transparent)}to{box-shadow:inset 0 0 0 1px var(--leaf),0 0 0 0 transparent}}}
.cropmain{display:block;width:100%;text-align:left;border:0;background:none;padding:16px;border-radius:var(--r-lg);color:inherit}
.crop.selc{border-color:var(--leaf);box-shadow:0 0 0 1px var(--leaf)}
.ldh .ren{width:28px;height:28px}
.rn{display:flex;align-items:center;gap:var(--s-1);flex:1 1 100%;min-width:0}
.rn input{flex:1;min-width:0;font-family:var(--display);font-weight:700;font-size:16px;border:1px solid var(--leaf);border-radius:var(--r-sm);padding:5px 9px;background:var(--surface);color:var(--fg);box-shadow:0 0 0 3px var(--leaf-soft)}
.rn input.bad{border-color:var(--rose);box-shadow:0 0 0 3px var(--rose-soft)}
.ibtn2.ok{color:var(--leaf-ink)}
.ibtn2.ok:hover{background:var(--leaf-soft);color:var(--leaf-ink)}
.rnerr{flex:1 1 100%;color:var(--rose);font-size:12px;margin-top:-4px}
.dial{position:absolute;right:16px;bottom:84px;z-index:var(--z-float);display:flex;flex-direction:column-reverse;align-items:flex-end;gap:var(--s-3)}
.dial .fab{position:static}
.fab.mini{width:42px;height:42px}
.dact{display:flex;align-items:center;gap:10px}
.dlab{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:var(--r-sm);padding:5px 10px;font-size:13px;font-weight:600;box-shadow:var(--shadow-1);white-space:nowrap}
.scrim{position:absolute;inset:0;background:var(--dim);z-index:var(--z-float-dim);border:0;padding:0;border-radius:0;cursor:default}
@media (prefers-reduced-motion:no-preference){.dact{animation:dpop var(--dur-fast) var(--ease)}@keyframes dpop{from{opacity:0;transform:translateY(8px)}}}
.mscrim{position:absolute;inset:0;background:var(--dim-strong);z-index:var(--z-dim);border:0;padding:0;border-radius:0;cursor:default}
.modal{position:absolute;z-index:var(--z-dialog);left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,calc(100% - 32px));background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:var(--r-xl);padding:20px;box-shadow:var(--shadow-3)}
.modal h3{font-family:var(--display);font-size:18px;margin:0 0 6px}
.modal p{margin:0 0 18px;color:var(--muted)}
.modal .mx{position:absolute;top:10px;right:10px}
.msum{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:var(--r-md);padding:10px 12px;margin-bottom:12px}
.msum b{display:block}.msum small{color:var(--muted)}
.mlist{margin:0 0 8px;padding-left:18px;color:var(--muted)}
.mlist li+li{margin-top:2px}
.modal p.hint{margin:0 0 16px}
.tundo{margin-left:14px;border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}
.mb .modal{top:auto;bottom:0;left:0;right:0;transform:none;width:auto;border-radius:var(--r-sheet) var(--r-sheet) 0 0;border-bottom:0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.mb .mact{flex-direction:column-reverse}
.mb .mact .btn{max-width:none;flex:none;width:100%;padding:var(--s-3) var(--s-4)}
.mact .btn.danger{display:inline-flex;align-items:center;justify-content:center;gap:6px}
@media (prefers-reduced-motion:no-preference){.mscrim{animation:cfade var(--dur-fast) var(--ease)}.modal{animation:cpop var(--dur-base) var(--ease)}.mb .modal,.mb .modal.dB{animation:csheet var(--dur-base) var(--ease)}
@keyframes cfade{from{opacity:0}}@keyframes cpop{from{opacity:0;transform:translate(-50%,-47%) scale(.96)}}@keyframes csheet{from{transform:translateY(100%)}}}
.t-warn{--tone:var(--sun);--tone-soft:var(--sun-soft);--tone-ink:var(--on-sun)}
.t-ok{--tone:var(--leaf);--tone-soft:var(--leaf-soft);--tone-ink:var(--on-leaf)}
.t-danger{--tone:var(--rose);--tone-soft:var(--rose-soft);--tone-ink:var(--on-rose)}
.tbtn{border:1px solid var(--tone);background:var(--tone);color:var(--tone-ink);border-radius:var(--r-sm);padding:var(--s-2) var(--s-3);font-weight:600;white-space:nowrap}
.tx{border:0;background:none;color:var(--fg);padding:var(--s-2) var(--s-3);border-radius:var(--r-sm);font-weight:600;white-space:nowrap}
.tx:hover{background:var(--surface2)}
.modal.dB{width:min(340px,calc(100% - 32px));padding:26px 22px 18px;text-align:center}
.dB-i{width:56px;height:56px;border-radius:50%;background:var(--tone-soft);color:var(--tone);display:grid;place-items:center;margin:0 auto 14px}
.modal.dB h3{font-size:19px;margin:0 0 6px}
.modal.dB p{margin:0 auto 20px;max-width:30ch}
.dB-a{display:flex;flex-wrap:wrap;gap:var(--s-2)}
.dB-a>*{flex:1 1 auto;padding:var(--s-3) var(--s-4)}

 return sec('ds-actdetail','Activity detail page','A page for one activity, opened by tapping an activity row on the Activity page or on the crop detail page. The sidebar and tab bar keep Activity highlighted. There is no floating button here.',
  '<div class="ds-var"><div class="ds-col"><div class="ds-lab">Desktop</div><div class="ds-scroll"><div class="ds-dev">'+D+'</div></div></div><div class="ds-col m"><div class="ds-lab">Mobile</div><div class="ds-dev mb">'+M+'</div></div></div>'+
  tbl(['Part','Spec'],[['Back link','<code>.lnk</code> with the chevron rotated 180°, no underline, <code>margin: 0 0 var(--s-2)</code>. The text is "All activities", or the crop name when the page was opened from a crop page. It goes back to where it came from'],['Header','<code>.head</code>. The title holds the activity type and a status badge beside it (inline flex, 10px gap, wraps): <code>.badge</code> when completed, <code>.badge.sun</code> otherwise. Subtitle: "&lt;date&gt; · &lt;plot&gt; · &lt;crop&gt;", where the crop is a <code>button.lnk</code> (margin 0, padding 0, inherited font size, no underline, no wrap) that opens the crop page'],
['Action buttons','Depend on the status (see Activity types and statuses). Mark done is <code>.btn.p</code> and comes first when shown. Start, Restore, Edit and Cancel activity are <code>.btn</code>. Delete is <code>.btn</code> with <code>color: var(--rose)</code> and comes last. Desktop: in the right side of the header, in a flex row that wraps, gap <code>var(--s-2)</code>. Mobile: the same row between the header and the cards, <code>margin-bottom: var(--s-3)</code>'],
['Edit activity','The Edit button opens the Log activity form in edit mode: page title "Edit activity", subtitle "Update the details of this activity.", fields filled in (name, date, season worked out from the date, linked crop, linked field, status, notes), primary button "Save changes", and Cancel, which returns to the activity. If the status is not Draft, In Progress or Completed (for example Scheduled), it shows as an extra status chip. Saving updates the activity, returns to its page, and shows the toast "Activity updated." with no Undo. The expense lines are kept'],
['Delete activity','The Delete button opens the danger confirmation popup (same one as the other deletes): title "Delete this activity?", message "&lt;activity&gt; on &lt;date&gt; and its N expenses (&lt;total&gt;) will be removed. Season expenses update." (the expenses part is left out when there are none), buttons Delete activity and Cancel. On confirm the activity goes, the Season expenses categories go down by its expense lines, and the page returns to where the user came from (the crop page or the Activity list). The toast "Activity deleted." has Undo for 6 seconds, and Undo puts the activity back in its position with its expenses and the Season totals'],
['Layout','Desktop: Expenses on the left and Notes on the right (<code>.grid.g2</code>). Mobile: Expenses, then Notes, stacked. With no notes there is no Notes card and Expenses is full width (no <code>.grid.g2</code>)'],['Expenses card','<code>.card</code>. Title "Expenses" (the heading is already flex with space between) with a primary <code>.btn.p</code> "+ Add expense" on the right, 14px, font inherited. It opens the Add expense form with this activity selected. Cancel or Save returns here. There is no total in the heading. Then a hero total in the display font, 28px, bold, line-height 1.1, and under it <code>small.hint</code> "across N expenses" ("across 1 expense" when there is one). Then a split bar: flex, 12px high, <code>var(--r-pill)</code>, overflow hidden, 2px gap, margin <code>var(--s-2) 0 var(--s-4)</code>, <code>role="img"</code> with <code>aria-label="Expense split"</code>, holding one <code>i</code> per expense as wide as its share of the total, in its category colour. Then a legend with one row per expense: flex, space between, centred, gap <code>var(--s-2)</code>, padding <code>var(--s-2) 0</code>, hairline top border. Left: a 10px round dot in the category colour (from Season expenses, or <code>var(--muted)</code> if unknown), the category in <code>b</code> and its percent in <code>small.hint</code>. Right: an inline flex group (gap <code>var(--s-1)</code>) with the amount as <code>.amt</code> and a row menu button (<code>.ibtn2</code>, three-dots icon at 16px, <code>aria-label="Actions for &lt;category&gt; expense"</code>, <code>aria-haspopup="menu"</code>, <code>aria-expanded</code>, <code>title="Actions"</code>). The row is <code>position: relative</code>. See Row actions menu for how the menu behaves. With no expenses, only the hint "No expenses recorded for this activity." (no total or bar). The card ends with the legend rows (or the empty hint)'],['Notes card','<code>.card</code>. Title "Notes" with the text below it. Only shown when the activity has notes'],['Mark done','The first action button, when the activity is not completed. Sets the status to Completed and shows the toast "Marked as done."'],['Row menu','Same pattern as the crop card menu. Tapping the button opens <code>.kmenu</code> (<code>role="menu"</code>, <code>aria-label="&lt;category&gt; expense actions"</code>, <code>top: 44px; right: 0</code> under the row) with two <code>role="menuitem"</code> items: Edit expense, then Delete expense. Focus moves to the first item. Esc closes it and returns focus to the button. A tap outside closes it, and so does choosing an item'],
['Edit expense','"Edit expense" is the first item in the row menu (edit icon at 16px). It opens the Add expense form in edit mode: page title "Edit expense", subtitle "Update the category or amount of this expense.", the Activity select disabled, category and amount filled in, primary button "Save changes", and Cancel, which returns to the activity. Saving updates that line, the activity total, the bar and the percentages. If the category changed, the amount moves between Season expenses categories. The toast is "Expense updated." with no Undo'],
['Delete expense','"Delete expense" is the second item in the row menu (<code>.kdel</code>, trash icon at 16px). It opens the danger confirmation popup (same one as delete crop and delete land): title "Delete this expense?", message "&lt;category&gt; &lt;amount&gt; will be removed from &lt;activity&gt;. The activity total and season expenses update.", buttons Delete expense and Cancel. On confirm the line goes, the hero total, split bar and percentages update, and the same amount comes off that category in Season expenses. The toast "Expense deleted." has Undo for 6 seconds, and Undo puts the line back in its position with the totals. Deleting the last line shows the empty hint'],['Expense lines','An activity keeps a list of expense lines (category and amount). Adding an expense appends a line. An activity with a cost but no lines shows one "Other" line']]))
}

function secBrand(){
 return sec('ds-brand','Brand','The MyFarm logo: a sprout with its roots in the soil, a rising sun and the field behind, inside a green ring. It replaces the leaf icon that stood in for the brand.',
  '<div class="ds-lab">Logo sizes</div><div class="ds-demo"><div class="ds-logo"><div>'+logoImg(96)+'96 · splash, about</div><div>'+logoImg(44)+'44 · page header</div><div>'+logoImg(32)+'32 · sidebar</div><div>'+logoImg(24)+'24 · too small</div></div></div>'+
  '<div class="ds-lab">On the Warli sign-in hero</div><div class="ds-warli"><span>'+logoImg(36)+'</span><b style="font-size:18px">MyFarm</b></div>'+
  tbl(['Use','Rule'],[['Sidebar','32px, round, beside the word MyFarm in Bricolage Grotesque'],['Sign-in hero','36px inside a 40px white circle with <code>--shadow-1</code>, so it stands out on the mud-brown background'],['Small sizes','Under 32px the roots and leaf ring blur. Browser tab, app icon and anything under 32px need a simplified mark: sprout, sun and ring only'],['Source','Embedded at 128px as WebP. Keep the full artwork for 96px and up']]))
}
function secBanner(){
 var K=[['warning','Price alert','bell','Onion reached your ₹2,100 alert','Now ₹2,150 per quintal at Lasalgaon APMC.','View price history',1],['critical','Problem','warn','Your last 3 changes were not saved','Check your connection. We will keep trying.','Try now',0],['info','Update','info','New version available','Version 2.4 adds sale tracking and mandi prices.','Update now',1],['new','New','star','New: record your sales','See profit per acre for every crop.','Take a look',1]];
 var bn=function(k){return '<div class="bn k-'+k[0]+'" role="'+(k[0]==='critical'?'alert':'status')+'"><span class="bn-i">'+ic(k[2],18)+'</span><div class="bn-t"><span class="bn-k">'+k[1]+'</span><b>'+k[3]+'</b><span class="bn-m">'+k[4]+'</span><button class="lnk" tabindex="-1">'+k[5]+' '+ic('chev',12)+'</button></div>'+(k[6]?'<button class="ibtn2" tabindex="-1" aria-label="Dismiss" style="width:28px;height:28px">'+ic('x',14)+'</button>':'')+'</div>'};
 var S='<div class="stack">'+K.map(bn).join('')+'</div>',T='<div class="stack">'+bn(K[1])+bn(K[0])+'<div class="bn-more"><span>3 more notifications</span><button class="lnk" tabindex="-1" style="margin:0;padding:0;text-decoration:none">View all '+ic('chev',12)+'</button></div></div>';
 return sec('ds-banner','Banners','One banner for everything the app tells the farmer: price alerts, problems, updates and news. A white card like the rest of the app. The kind sets only the icon chip and a small label, so different banners still look like one family. Only a problem gets a coloured border.',
  pair(S,S)+'<div class="ds-lab">When several are active</div>'+pair(T,T)+
  tbl(['Kind','Class','Dismiss','Use'],[['Problem','<code>.bn.k-critical</code>, rose','Cannot dismiss','Something is broken or data may be lost. Stays until fixed. Always on top'],['Warning','<code>.bn.k-warning</code>, amber','Can dismiss','Needs action soon: price alert reached, rain coming, activity overdue. A falling price alert uses the rose chip'],['Info and update','<code>.bn.k-info</code>, sky','Can dismiss, or Later','A new version, a service notice, delayed prices'],['New','<code>.bn.k-new</code>, green','Dismiss, shown once','A new feature or a tip']])+
  tbl(['Part','Spec'],[['Card','<code>.bn</code>: surface, 1px border, <code>--r-lg</code>, 12px padding, 12px gap'],['Chip','36px, <code>--r-md</code>, kind tint with the kind colour, 18px icon'],['Text','Kind label (11px caps, kind colour), bold title, one muted line, then one link action'],['Stacking','At most two banners at the top of a screen, problem first, then warning, update, news. The rest collapse into one dashed "N more notifications" row. A dismissed banner stays gone until its content changes'],['Where','Home and the screen it is about (a price alert also shows on Prices)']]))
}

function buildSystem(){
  var T=[['--bg','Page background'],['--surface','Cards, dialogs'],['--surface2','Quiet fills'],['--line','Borders'],['--fg','Text'],['--muted','Secondary text'],['--leaf','Primary action'],['--leaf-soft','Primary tint'],['--leaf-ink','Primary text'],['--sun','Warning'],['--sun-soft','Warning tint'],['--sky','Info, water'],['--rose','Danger'],['--rose-soft','Danger tint'],['--sky-soft','Info tint'],['--on-leaf','Text on green, red'],['--on-sun','Text on amber'],['--clay','Land colour'],['--ember','Land colour'],['--grape','Land colour, spend'],['--dim','Dim behind a menu'],['--dim-strong','Dim behind a dialog']];

  h+='<section class="ds-sec" id="ds-type"><h2>Type</h2><p>Bricolage Grotesque for titles and key numbers, Figtree for everything else.</p><div class="ds-demo col ds-type"><div><small>Page title · 24</small><span style="font-family:var(--display);font-size:24px;font-weight:700">Good morning, Ram</span></div><div><small>Section title · 18</small><span style="font-family:var(--display);font-size:18px;font-weight:700">Season expenses</span></div><div><small>Card title · 16</small><span style="font-family:var(--display);font-size:16px;font-weight:700">Crop progress</span></div><div><small>Body · 14</small><span>Spray Tank Side before rain arrives on Saturday.</span></div><div><small>Caption · 12</small><span style="font-size:12px;color:var(--muted)">Tank Side · 1.6 ac · 6 days to harvest</span></div><div><small>Figures · tabular</small><span style="font-variant-numeric:tabular-nums;font-family:var(--display);font-size:20px;font-weight:700">₹1,24,500</span></div></div></section>';
  h+=secSpace();
  h+=secRadius();
  h+=secShadow();
  h+=secLayers();
  h+=secBreak();
  h+=secMotion();
  h+=secIcons();
  h+=secBrand();
  h+=secFormats();
  h+='<section class="ds-sec" id="ds-btn"><h2>Buttons and badges</h2><p>One main action per screen. Two sizes: default (8px 12px) and large (12px 16px) for dialogs and full-width mobile buttons. Danger is only for destructive actions. On mobile, create actions live in the floating menu.</p><div class="ds-lab">Buttons</div><div class="ds-demo"><button class="btn p">Primary</button><button class="btn">Default</button><button class="btn warn">Warning</button><button class="btn danger">Danger</button><button class="btn" disabled>Disabled</button><button class="btn p lg">Large primary</button><button class="lnk" style="margin-left:0">Link action '+ic('chev',14)+'</button><button class="ibtn2" aria-label="Edit">'+ic('edit',16)+'</button><button class="ibtn2" aria-label="Delete">'+ic('trash',16)+'</button><button class="fab" style="position:static" aria-label="Quick actions">'+ic('plus',24)+'</button></div><div class="ds-lab">Badges</div><div class="ds-demo"><span class="badge">Planted</span><span class="badge sun">Harvest</span><span class="badge sky">Today</span><span class="badge rose">Overdue</span><span class="badge mute">Fallow</span></div></section>';
  h+=secCards();
  h+=secMenu();
  h+=secDetail();
  h+=secActRow();
  h+=secActDetail();
  h+=secAStatus();
  h+=secProgress();
  h+=secFab();
  h+=secNav();
  h+=secAlerts();
  h+=secBanner();
  h+=secForm();
  h+=secFilter();
  h+=secSettings();
  h+='<section class="ds-sec" id="ds-toast"><h2>Toasts</h2><p>Short messages that clear on their own after 4 seconds. Toasts with Undo stay for 6 seconds.</p><div class="ds-demo col" style="align-items:flex-start"><div class="toast static">North Plot saved.</div><div class="toast static warn">North Plot has 1 crop. Remove it before deleting the land.</div><div class="toast static err">Could not save. Check your connection and try again.</div><div class="toast static">Onion deleted.<button class="tundo">Undo</button></div></div></section>';
  h+='<section class="ds-sec" id="ds-rows"><h2>List rows</h2><p>Rows select on tap. The selected row gets a tint, an outline and a short glow.</p><div class="card" style="max-width:460px"><div class="row"><button class="lrow" tabindex="-1"><span class="dot" style="background:var(--clay)"></span><div class="grow"><b>North Plot</b><small>Onion</small></div><span class="amt">2.4 ac</span></button><button class="ibtn2" aria-label="Delete North Plot">'+ic('trash',16)+'</button></div><div class="row sel"><button class="lrow" tabindex="-1"><span class="dot" style="background:var(--grape)"></span><div class="grow"><b>River Field</b><small>Grapes</small></div><span class="amt">3.1 ac</span></button><button class="ibtn2" aria-label="Delete River Field">'+ic('trash',16)+'</button></div><div class="row"><button class="lrow" tabindex="-1"><span class="dot" style="background:var(--ember)"></span><div class="grow"><b>Tank Side</b><small>Tomato</small></div><span class="amt">1.6 ac</span></button><button class="ibtn2" aria-label="Delete Tank Side">'+ic('trash',16)+'</button></div></div></section>';
  h+='<section class="ds-sec" id="ds-dlg"><h2>Confirmation popups</h2><p>One confirmation popup in three tones: warning, success and danger. Pick a tone and two or three buttons, then press the buttons in the previews.</p><div class="seg" id="toneSeg" role="group" aria-label="Tone" style="margin-bottom:6px"><button type="button" data-tone="warn" aria-pressed="false">Warning</button><button type="button" data-tone="ok" aria-pressed="false">Success</button><button type="button" data-tone="danger" aria-pressed="true">Danger</button></div> <div class="seg" id="btnSeg" role="group" aria-label="Number of buttons" style="margin-bottom:6px;margin-left:8px"><button type="button" data-btns="2" aria-pressed="true">Two buttons</button><button type="button" data-btns="3" aria-pressed="false">Three buttons</button></div><div id="appr">'+approachesHtml(DTONE)+'</div>'+
    '<h3>Shared rules</h3><div class="ds-rules"><div><b>Focus</b>Warning and danger focus the Cancel side. Success focuses the main action.</div><div><b>Layout</b>A centred dialog on desktop. A bottom sheet with a grab handle on mobile.</div><div><b>Closing</b>Esc, the close button and the dimmed background cancel.</div><div><b>Buttons</b>Two or three in one row, never more. Cancel first, the main action last. They share the width and wrap on narrow screens.</div><div><b>Wording</b>Name the object: Delete land, not OK. Warning and danger titles ask a question. Success states what happened.</div><div><b>Undo</b>Where possible, skip the long warning and offer Undo in the toast.</div></div></section>';
  h+='</div></div>';
  document.getElementById('sys').innerHTML=h;
}

  var g=e.target.closest('[data-goto]');if(g){var t=document.getElementById(g.dataset.goto);if(t&&t.scrollIntoView)t.scrollIntoView({behavior:'smooth',block:'start'});return}
  var nb=e.target.closest('[data-btns]');if(nb){DBTN=+nb.dataset.btns;document.getElementById('appr').innerHTML=approachesHtml(DTONE);document.querySelectorAll('#btnSeg button').forEach(function(x){x.setAttribute('aria-pressed',x===nb)});return}

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-theme-set]');
  if(t){var v=t.dataset.themeSet,root=document.documentElement;if(v==='system')root.removeAttribute('data-theme');else root.setAttribute('data-theme',v);document.querySelectorAll('#themeSeg button').forEach(function(x){x.setAttribute('aria-pressed',x===t)});return}
  var rp=e.target.closest('[data-replay]');

document.addEventListener('keydown',function(e){if(e.key!=='Escape')return;['d','m'].forEach(function(x){if(KM[x]){var k=x+'-'+KM[x];KM[x]=null;renderMenus();var t=document.querySelector('[data-kmenu="'+k+'"]');if(t)t.focus()}})});
document.addEventListener('click',function(e){
  var km=e.target.closest('[data-kmenu]');
  if(km){var id=km.dataset.kmenu,x=id.charAt(0),k=id.slice(2),was=KM[x]===k;KM.d=null;KM.m=null;if(!was)KM[x]=k;renderMenus();if(!was){var f=document.querySelector('#menuDemo-'+x+' .kmenu button');if(f)f.focus()}else{var t=document.querySelector('[data-kmenu="'+id+'"]');if(t)t.focus()}return}
  if((KM.d||KM.m)&&e.target.closest('.kmenu')){KM.d=null;KM.m=null;renderMenus();return}

});

})();
