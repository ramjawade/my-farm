<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profile save states</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><div class="container py-4"><div class="row g-4">
<div class="col-md-4"><h6>1. Phone read-only</h6><div class="card card-body">
<label class="form-label">Phone</label><input class="form-control" value="+91 98765 43210" readonly disabled>
<div class="form-text">Your sign-in number can't be changed here.</div>
<label class="form-label mt-3">Role</label><select class="form-select"><option>Farm owner</option></select></div></div>
<div class="col-md-4"><h6>2. Saving</h6><div class="card card-body">
<input class="form-control mb-3" value="Green Acres"><button class="btn btn-success" disabled>
<span class="spinner-border spinner-border-sm me-2"></span>Saving…</button></div></div>
<div class="col-md-4"><h6>3. Save failed</h6><div class="card card-body">
<div class="alert alert-danger">Couldn't save your farm details. Your changes are kept — try again.</div>
<input class="form-control mb-3" value="Green Acres"><button class="btn btn-success">Save</button></div></div>
</div></div></body></html>
