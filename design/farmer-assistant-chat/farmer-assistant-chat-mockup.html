<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Farmer Assistant Chat Mockup</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">
<style>
  /* Same bubble colours as chat-panel.component.scss */
  body { background: #f1f3f2; }
  .phone { width: 340px; height: 620px; border: 8px solid #222; border-radius: 28px; background: #fff; overflow: hidden; position: relative; }
  .thread { overflow-y: auto; }
  .bubble { max-width: 85%; }
  .bubble--bot { background: #e7f2ec; }
  .bubble--farmer { background: #2f6e4b; color: #fff; }
  .past { opacity: .55; }
  .day { font-size: .7rem; }
  .brief-row { font-size: .9rem; }
  .overlay { position: absolute; inset: 0; background: rgba(0,0,0,.45); }
  figure { margin: 0; }
  figcaption { max-width: 340px; }
</style>
</head>
<body>
<div class="container-fluid py-4">
  <h1 class="h4">Farmer assistant chat — UX preview</h1>
  <p class="text-muted mb-4">Static mockup for review. Same panel, bubbles and chips as today; new parts are marked <span class="badge text-bg-warning">new</span>.</p>

  <div class="d-flex flex-wrap gap-4">

    <!-- 1. Open: brief -->
    <figure>
      <div class="phone d-flex flex-column">
        <header class="d-flex justify-content-between align-items-start gap-2 p-3 border-bottom">
          <div>
            <h2 class="h6 mb-1"><i class="bi bi-chat-dots me-1"></i>My farm assistant <span class="badge text-bg-warning">new</span></h2>
            <p class="small text-muted mb-0">Ask about your farm or log an activity</p>
          </div>
          <div class="d-flex align-items-center gap-2">
            <button class="btn btn-sm btn-link text-muted p-0" title="Clear chat"><i class="bi bi-trash"></i></button>
            <button class="btn-close" aria-label="Close"></button>
          </div>
        </header>
        <div class="thread flex-grow-1 p-3">
          <div class="text-center text-muted day mb-2">Today</div>
          <div class="d-flex mb-2"><div class="bubble bubble--bot p-2 px-3 rounded-3">
            <div class="fw-semibold mb-2">Good morning, Ramesh 🌱</div>
            <div class="brief-row mb-1"><i class="bi bi-cloud-sun me-2"></i>Plot 1: 31°C, no rain expected</div>
            <div class="brief-row mb-1"><i class="bi bi-list-check me-2"></i>2 activities pending<br>
              <span class="text-muted ms-4">Irrigation · Wheat · today<br></span>
              <span class="text-muted ms-4">Spraying · Onion · Fri</span></div>
            <div class="brief-row mb-2"><i class="bi bi-currency-rupee me-2"></i>₹4,200 spent in the last 7 days</div>
            <div class="d-flex flex-wrap gap-2">
              <button class="btn btn-sm btn-outline-primary rounded-pill">What did I spend this month?</button>
              <button class="btn btn-sm btn-outline-primary rounded-pill">What's pending?</button>
            </div>
          </div></div>
        </div>
        <form class="d-flex gap-2 p-3 border-top">
          <input class="form-control" placeholder="Ask or log something…">
          <button type="button" class="btn btn-primary">Send</button>
        </form>
      </div>
      <figcaption class="small mt-2"><strong>1 · Open the chat</strong> — brief appears once a day, no AI call. Chips are examples of what to ask (they send as a question).</figcaption>
    </figure>

    <!-- 2. Question and answer -->
    <figure>
      <div class="phone d-flex flex-column">
        <header class="d-flex justify-content-between align-items-start gap-2 p-3 border-bottom">
          <div><h2 class="h6 mb-1"><i class="bi bi-chat-dots me-1"></i>My farm assistant</h2>
            <p class="small text-muted mb-0">Ask about your farm or log an activity</p></div>
          <button class="btn-close" aria-label="Close"></button>
        </header>
        <div class="thread flex-grow-1 p-3">
          <div class="d-flex justify-content-end mb-2"><div class="bubble bubble--farmer p-2 px-3 rounded-3">How much did I spend on wheat this season?</div></div>
          <div class="d-flex mb-2"><div class="bubble bubble--bot p-2 px-3 rounded-3">
            You've spent <strong>₹18,450</strong> on wheat this season.<br>
            <div class="small mt-2">Labour ₹9,000 · Seeds ₹5,200 · Fertilizer ₹4,250</div>
          </div></div>
          <div class="d-flex justify-content-end mb-2"><div class="bubble bubble--farmer p-2 px-3 rounded-3">and for the cotton?</div></div>
          <div class="d-flex mb-2"><div class="bubble bubble--bot p-2 px-3 rounded-3">
            I couldn't find a crop called "cotton". Which one did you mean?
            <div class="d-flex flex-wrap gap-2 mt-2">
              <button class="btn btn-sm btn-outline-primary rounded-pill">Wheat</button>
              <button class="btn btn-sm btn-outline-primary rounded-pill">Onion</button>
              <button class="btn btn-sm btn-outline-primary rounded-pill">Sugarcane</button>
            </div>
          </div></div>
        </div>
        <form class="d-flex gap-2 p-3 border-top">
          <input class="form-control" placeholder="Ask or log something…"><button type="button" class="btn btn-primary">Send</button>
        </form>
      </div>
      <figcaption class="small mt-2"><strong>2 · Ask a question</strong> — answer built from your recorded expenses. Unknown or ambiguous names offer your real crops/lands as chips.</figcaption>
    </figure>

    <!-- 3. Logging unchanged, routed automatically -->
    <figure>
      <div class="phone d-flex flex-column">
        <header class="d-flex justify-content-between align-items-start gap-2 p-3 border-bottom">
          <div><h2 class="h6 mb-1"><i class="bi bi-chat-dots me-1"></i>My farm assistant</h2>
            <p class="small text-muted mb-0">Ask about your farm or log an activity</p></div>
          <button class="btn-close" aria-label="Close"></button>
        </header>
        <div class="thread flex-grow-1 p-3">
          <div class="d-flex justify-content-end mb-2"><div class="bubble bubble--farmer p-2 px-3 rounded-3">Sprayed pesticide today, paid 500 for labour</div></div>
          <div class="d-flex mb-2"><div class="bubble bubble--bot p-2 px-3 rounded-3">
            Which land is this for?
            <div class="d-flex flex-wrap gap-2 mt-2">
              <button class="btn btn-sm btn-outline-primary rounded-pill">Plot 1</button>
              <button class="btn btn-sm btn-outline-primary rounded-pill">Plot 2</button>
            </div>
          </div></div>
          <div class="d-flex justify-content-end mb-2"><div class="bubble bubble--farmer p-2 px-3 rounded-3">Plot 1</div></div>
          <div class="d-flex mb-2"><div class="bubble bubble--bot p-2 px-3 rounded-3">
            Got it — everything's filled in. Tap Review &amp; Save when you're ready.
            <div class="mt-2"><button class="btn btn-sm btn-primary rounded-pill">Review &amp; Save</button></div>
          </div></div>
        </div>
        <form class="d-flex gap-2 p-3 border-top">
          <input class="form-control" placeholder="Ask or log something…"><button type="button" class="btn btn-primary">Send</button>
        </form>
      </div>
      <figcaption class="small mt-2"><strong>3 · Logging</strong> — no mode switch. The bot works out it's a log entry; clarify → Review &amp; Save is exactly as today.</figcaption>
    </figure>

    <!-- 4. Restored history + marathi -->
    <figure>
      <div class="phone d-flex flex-column">
        <header class="d-flex justify-content-between align-items-start gap-2 p-3 border-bottom">
          <div><h2 class="h6 mb-1"><i class="bi bi-chat-dots me-1"></i>माझा शेत सहाय्यक</h2>
            <p class="small text-muted mb-0">शेतीबद्दल विचारा किंवा नोंद करा</p></div>
          <div class="d-flex align-items-center gap-2"><button class="btn btn-sm btn-link text-muted p-0"><i class="bi bi-trash"></i></button><button class="btn-close" aria-label="Close"></button></div>
        </header>
        <div class="thread flex-grow-1 p-3">
          <div class="text-center mb-2"><button class="btn btn-sm btn-link">Load older messages <span class="badge text-bg-warning">new</span></button></div>
          <div class="text-center text-muted day mb-2">Yesterday</div>
          <div class="d-flex justify-content-end mb-2 past"><div class="bubble bubble--farmer p-2 px-3 rounded-3">Irrigated Plot 2</div></div>
          <div class="d-flex mb-2 past"><div class="bubble bubble--bot p-2 px-3 rounded-3">Got it — everything's filled in. Tap Review &amp; Save when you're ready.</div></div>
          <div class="text-center text-muted day mb-2">Today</div>
          <div class="d-flex justify-content-end mb-2"><div class="bubble bubble--farmer p-2 px-3 rounded-3">या महिन्यात किती खर्च झाला?</div></div>
          <div class="d-flex mb-2"><div class="bubble bubble--bot p-2 px-3 rounded-3">या महिन्यात तुम्ही एकूण <strong>₹7,800</strong> खर्च केले.</div></div>
        </div>
        <form class="d-flex gap-2 p-3 border-top">
          <input class="form-control" placeholder="काहीतरी विचारा किंवा नोंद करा…"><button type="button" class="btn btn-primary">पाठवा</button>
        </form>
      </div>
      <figcaption class="small mt-2"><strong>4 · Reopened, in Marathi</strong> — older messages restored (buttons from old sessions show as plain text); answers follow the app language.</figcaption>
    </figure>

    <!-- 5. Clear confirm -->
    <figure>
      <div class="phone d-flex flex-column">
        <header class="d-flex justify-content-between align-items-start gap-2 p-3 border-bottom">
          <div><h2 class="h6 mb-1"><i class="bi bi-chat-dots me-1"></i>My farm assistant</h2>
            <p class="small text-muted mb-0">Ask about your farm or log an activity</p></div>
          <div class="d-flex align-items-center gap-2"><button class="btn btn-sm btn-link text-muted p-0"><i class="bi bi-trash"></i></button><button class="btn-close"></button></div>
        </header>
        <div class="thread flex-grow-1 p-3">
          <div class="d-flex justify-content-end mb-2"><div class="bubble bubble--farmer p-2 px-3 rounded-3">What's pending on Plot 2?</div></div>
          <div class="d-flex mb-2"><div class="bubble bubble--bot p-2 px-3 rounded-3">Plot 2 has 1 pending activity: Irrigation (Scheduled, today).</div></div>
        </div>
        <form class="d-flex gap-2 p-3 border-top"><input class="form-control" placeholder="Ask or log something…"><button type="button" class="btn btn-primary">Send</button></form>
        <div class="overlay d-flex align-items-center justify-content-center p-4">
          <div class="card shadow"><div class="card-body">
            <h3 class="h6">Clear chat?</h3>
            <p class="small text-muted">This deletes your whole conversation. Saved activities are not affected.</p>
            <div class="d-flex justify-content-end gap-2"><button class="btn btn-sm btn-outline-secondary">Cancel</button><button class="btn btn-sm btn-danger">Clear chat</button></div>
          </div></div>
        </div>
      </div>
      <figcaption class="small mt-2"><strong>5 · Clear chat</strong> — confirmation before wiping history. Logged activities are untouched.</figcaption>
    </figure>

    <!-- 6. Out of scope + unavailable -->
    <figure>
      <div class="phone d-flex flex-column">
        <header class="d-flex justify-content-between align-items-start gap-2 p-3 border-bottom">
          <div><h2 class="h6 mb-1"><i class="bi bi-chat-dots me-1"></i>My farm assistant</h2>
            <p class="small text-muted mb-0">Ask about your farm or log an activity</p></div>
          <button class="btn-close"></button>
        </header>
        <div class="thread flex-grow-1 p-3">
          <div class="d-flex justify-content-end mb-2"><div class="bubble bubble--farmer p-2 px-3 rounded-3">Tell me a joke</div></div>
          <div class="d-flex mb-2"><div class="bubble bubble--bot p-2 px-3 rounded-3">
            I can help with your farm. Try asking about spending, pending work, your crops or the weather — or tell me an activity to log.
            <div class="d-flex flex-wrap gap-2 mt-2">
              <button class="btn btn-sm btn-outline-primary rounded-pill">Spending this month</button>
              <button class="btn btn-sm btn-outline-primary rounded-pill">Weather</button>
            </div>
          </div></div>
          <div class="d-flex justify-content-end mb-2"><div class="bubble bubble--farmer p-2 px-3 rounded-3">What did I spend on onion?</div></div>
          <div class="d-flex mb-2"><div class="bubble bubble--bot p-2 px-3 rounded-3">The chat assistant is temporarily unavailable. Please try again in a moment, or use the manual form.</div></div>
        </div>
        <form class="d-flex gap-2 p-3 border-top"><input class="form-control" placeholder="Ask or log something…"><button type="button" class="btn btn-primary">Send</button></form>
      </div>
      <figcaption class="small mt-2"><strong>6 · Edge cases</strong> — off-topic gets a helpful nudge; if the AI provider is down, the bot says so and never invents an answer.</figcaption>
    </figure>

  </div>
</div>
</body>
</html>
