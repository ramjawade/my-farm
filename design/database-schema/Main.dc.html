  <text x="78" y="130" class="legendtext" fill="oklch(0.50 0.02 260)">Every farmer-owned table also carries <tspan class="fname" fill="oklch(0.35 0.02 260)">created_at</tspan>, <tspan class="fname" fill="oklch(0.35 0.02 260)">updated_at</tspan> (delta-pull watermark) and <tspan class="fname" fill="oklch(0.35 0.02 260)">deleted_at</tspan> (soft-delete tombstone, so deletes reach a client that was offline).</text>

  <rect x="1290" y="176" width="330" height="222" rx="10" fill="oklch(0.96 0.02 265)" stroke="oklch(0.78 0.06 265)" stroke-width="1" />
  <text x="1310" y="202" class="noteTitle">Why UUIDv7, not a sequence</text>
  <text x="1310" y="226" class="note">Postgres sequences need the server. This app is</text>
  <text x="1310" y="243" class="note">offline-first: a record created in a field with no</text>
  <text x="1310" y="260" class="note">signal must have an identity immediately.</text>
  <text x="1310" y="284" class="note">UUIDv7 is minted on the client and carries a</text>
  <text x="1310" y="301" class="note">millisecond timestamp in its high bits, so inserts</text>
  <text x="1310" y="318" class="note">stay sequential in the B-tree instead of scattering.</text>
  <text x="1310" y="342" class="note">It also makes sync idempotent: the server upserts</text>
  <text x="1310" y="359" class="note">by primary key, so a replayed push changes nothing.</text>
  <text x="1310" y="383" class="note" fill="oklch(0.50 0.14 25)">Five incompatible id formats exist today — all are</text>
  <text x="1310" y="400" class="note" fill="oklch(0.50 0.14 25)">remapped once during migration.</text>

  <rect x="1290" y="424" width="330" height="182" rx="10" fill="oklch(0.96 0.03 25)" stroke="oklch(0.74 0.09 25)" stroke-width="1" />
  <text x="1310" y="450" class="noteTitle">Tenancy is application code now</text>
  <text x="1310" y="474" class="note">Firestore rules used to make cross-tenant reads</text>
  <text x="1310" y="491" class="note">impossible at the database. That guarantee is gone.</text>
  <text x="1310" y="515" class="note">One missing <tspan class="fname">WHERE farmer_id</tspan> is a leak, and it</text>
  <text x="1310" y="532" class="note">passes every happy-path test. Three layers answer it:</text>
  <text x="1310" y="556" class="note">1 · a repository that cannot be built unscoped</text>
  <text x="1310" y="573" class="note">2 · Postgres row-level security</text>
  <text x="1310" y="590" class="note">3 · a cross-tenant test per endpoint (404, not 403)</text>

  <rect x="1290" y="632" width="330" height="110" rx="10" fill="oklch(0.96 0.02 155)" stroke="oklch(0.74 0.07 155)" stroke-width="1" />
  <text x="1310" y="658" class="noteTitle">Excluded from v1</text>
  <text x="1310" y="682" class="note"><tspan class="fname">role</tspan> · <tspan class="fname">farmer_role</tspan> · <tspan class="fname">module</tspan> · <tspan class="fname">role_module</tspan></text>
  <text x="1310" y="706" class="note">user_role is free text nothing reads. Unused</text>
  <text x="1310" y="723" class="note">permission tables add schema without behaviour.</text>

  <text x="840" y="856" class="footer" text-anchor="middle">SQLAlchemy models are the source of truth · Alembic generates the migrations · client types generate from the OpenAPI schema</text>
