<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
  </style>
</helmet>
<div style="width:1440px;height:800px;background:oklch(0.97 0.005 260);display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding:20px">
<svg viewBox="0 0 1400 760" width="1400" height="760" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="oklch(0.45 0.02 260)" />
    </marker>
  </defs>
  <style>
    .title{font:700 27px 'IBM Plex Sans',sans-serif;fill:oklch(0.20 0.02 260)}
    .subtitle{font:400 13.5px 'IBM Plex Sans',sans-serif;fill:oklch(0.52 0.02 260)}
    .hdrtext{font:600 14px 'IBM Plex Sans',sans-serif;fill:#ffffff}
    .miniHdr{font:600 12.5px 'IBM Plex Sans',sans-serif;fill:oklch(0.22 0.02 260)}
    .fld{font:400 11px 'IBM Plex Mono',monospace;fill:oklch(0.32 0.02 260)}
    .lbl{font:600 11px 'IBM Plex Sans',sans-serif;fill:oklch(0.45 0.02 260)}
    .note{font:400 12px 'IBM Plex Sans',sans-serif;fill:oklch(0.42 0.02 260)}
    .noteTitle{font:700 13px 'IBM Plex Sans',sans-serif;fill:oklch(0.20 0.02 260)}
    .tier{font:500 10.5px 'IBM Plex Mono',monospace;fill:oklch(0.50 0.10 150)}
    .box{fill:oklch(1 0 0);stroke:oklch(0.88 0.01 260);stroke-width:1}
    .boxExt{fill:oklch(1 0 0);stroke:oklch(0.65 0.01 260);stroke-width:1;stroke-dasharray:4 3}
  </style>

  <text x="700" y="34" class="title" text-anchor="middle">MyFarm — System Architecture</text>
  <text x="700" y="56" class="subtitle" text-anchor="middle">Angular PWA · FastAPI on Render · Neon Postgres · Firebase Auth retained for phone OTP</text>

  <!-- ============ CLIENT ============ -->
  <rect x="40" y="90" width="470" height="470" rx="12" fill="oklch(0.99 0.002 260)" stroke="oklch(0.80 0.01 260)" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="275" y="118" class="miniHdr" text-anchor="middle" font-size="14">Angular 20 PWA — GitHub Pages (static)</text>

  <rect x="66" y="134" width="418" height="42" rx="7" class="box" />
  <text x="275" y="160" class="fld" text-anchor="middle">Components (signals, zoneless)</text>

  <rect x="66" y="186" width="418" height="42" rx="7" class="box" />
  <text x="275" y="212" class="fld" text-anchor="middle">Feature services — activity · crop · land · weather</text>

  <rect x="66" y="238" width="418" height="46" rx="7" fill="oklch(0.95 0.03 265)" stroke="oklch(0.62 0.10 265)" stroke-width="1.5" />
  <text x="275" y="259" class="miniHdr" text-anchor="middle" font-size="12">IStorageService — the swap seam</text>
  <text x="275" y="275" class="fld" text-anchor="middle" font-size="10">per-entity CRUD · one DI binding in app.config.ts</text>

  <rect x="66" y="294" width="418" height="42" rx="7" class="box" />
  <text x="275" y="313" class="fld" text-anchor="middle">ApiStorageService (adapter)</text>
  <text x="275" y="328" class="fld" text-anchor="middle" font-size="10">mapper: domain model ⇄ wire shape</text>

  <rect x="66" y="346" width="418" height="66" rx="7" fill="oklch(0.96 0.04 85)" stroke="oklch(0.70 0.10 85)" stroke-width="1.5" />
  <text x="275" y="368" class="miniHdr" text-anchor="middle" font-size="12">IndexedDB — outbox + cache</text>
  <text x="275" y="385" class="fld" text-anchor="middle" font-size="10">writes commit locally, never block on network</text>
  <text x="275" y="400" class="fld" text-anchor="middle" font-size="10">sync worker drains queue on reconnect</text>

  <rect x="66" y="422" width="418" height="38" rx="7" class="box" />
  <text x="275" y="446" class="fld" text-anchor="middle">Service worker (@angular/service-worker)</text>

  <text x="275" y="492" class="note" text-anchor="middle">Client mints UUIDv7 ids offline —</text>
  <text x="275" y="509" class="note" text-anchor="middle">so a retried push is an idempotent upsert.</text>
  <text x="275" y="536" class="tier" text-anchor="middle">FREE · GitHub Pages</text>

  <!-- ============ FIREBASE AUTH ============ -->
  <rect x="590" y="96" width="290" height="86" rx="10" fill="oklch(0.97 0.03 65)" stroke="oklch(0.72 0.11 65)" stroke-width="1.5" filter="url(#shadow)" />
  <text x="735" y="122" class="miniHdr" text-anchor="middle" font-size="13">Firebase Auth</text>
  <text x="735" y="141" class="fld" text-anchor="middle" font-size="10.5">phone OTP → ID token (JWT)</text>
  <text x="735" y="157" class="fld" text-anchor="middle" font-size="10.5">the only Firebase piece retained</text>
  <text x="735" y="173" class="tier" text-anchor="middle">FREE tier</text>

  <!-- ============ FASTAPI ============ -->
  <rect x="590" y="222" width="450" height="268" rx="12" fill="oklch(0.99 0.002 260)" stroke="oklch(0.55 0.12 155)" stroke-width="2" filter="url(#shadow)" />
  <rect x="590" y="222" width="450" height="34" rx="12" fill="oklch(0.52 0.12 155)" />
  <rect x="590" y="244" width="450" height="12" fill="oklch(0.52 0.12 155)" />
  <text x="815" y="245" class="hdrtext" text-anchor="middle">FastAPI — Render · Singapore</text>

  <rect x="612" y="272" width="406" height="40" rx="7" class="box" />
  <text x="815" y="290" class="fld" text-anchor="middle">verify_id_token() — firebase-admin</text>
  <text x="815" y="304" class="fld" text-anchor="middle" font-size="10">signature · expiry · audience → uid</text>

  <rect x="612" y="320" width="406" height="36" rx="7" class="box" />
  <text x="815" y="343" class="fld" text-anchor="middle">Pydantic v2 — request/response validation</text>

  <rect x="612" y="364" width="406" height="52" rx="7" fill="oklch(0.95 0.04 25)" stroke="oklch(0.60 0.14 25)" stroke-width="1.5" />
  <text x="815" y="384" class="miniHdr" text-anchor="middle" font-size="12">Tenant-scoped repository</text>
  <text x="815" y="401" class="fld" text-anchor="middle" font-size="10">cannot be constructed without farmer_id</text>

  <rect x="612" y="424" width="406" height="36" rx="7" class="box" />
  <text x="815" y="447" class="fld" text-anchor="middle">Routers — farms · lands · crops · activities · sync</text>

  <text x="815" y="478" class="tier" text-anchor="middle">FREE · 512 MB / 0.1 CPU · sleeps at 15 min</text>

  <!-- ============ POSTGRES ============ -->
  <rect x="590" y="536" width="450" height="112" rx="12" fill="oklch(1 0 0)" stroke="oklch(0.42 0.14 265)" stroke-width="2" filter="url(#shadow)" />
  <rect x="590" y="536" width="450" height="34" rx="12" fill="oklch(0.42 0.14 265)" />
  <rect x="590" y="558" width="450" height="12" fill="oklch(0.42 0.14 265)" />
  <text x="815" y="559" class="hdrtext" text-anchor="middle">Neon PostgreSQL — Singapore</text>
  <text x="815" y="590" class="fld" text-anchor="middle">pooled endpoint · Row-Level Security · scale-to-zero</text>
  <text x="815" y="608" class="fld" text-anchor="middle" font-size="10.5">SQLAlchemy 2.0 async + asyncpg · Alembic migrations</text>
  <text x="815" y="632" class="tier" text-anchor="middle">FREE · 0.5 GB · 100 CU-h/mo · wakes on connect</text>

  <!-- ============ SIDE SERVICES ============ -->
  <rect x="1110" y="272" width="252" height="88" rx="10" class="box" filter="url(#shadow)" />
  <text x="1236" y="298" class="miniHdr" text-anchor="middle" font-size="13">Cloudflare R2</text>
  <text x="1236" y="317" class="fld" text-anchor="middle" font-size="10.5">activity photos, via presigned URL</text>
  <text x="1236" y="333" class="fld" text-anchor="middle" font-size="10.5">DB stores storage_key only</text>
  <text x="1236" y="351" class="tier" text-anchor="middle">FREE · 10 GB · no egress fee</text>

  <rect x="1110" y="400" width="252" height="76" rx="10" class="boxExt" />
  <text x="1236" y="426" class="miniHdr" text-anchor="middle" font-size="13">OpenWeatherMap</text>
  <text x="1236" y="445" class="fld" text-anchor="middle" font-size="10.5">key held server-side only</text>
  <text x="1236" y="461" class="fld" text-anchor="middle" font-size="10.5">never shipped to the browser</text>

  <!-- ============ ARROWS ============ -->
  <g stroke="oklch(0.45 0.02 260)" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M510,150 L590,142" />
    <path d="M510,262 L560,262 L560,300 L590,300" />
    <path d="M815,490 L815,536" />
    <path d="M1040,320 L1110,318" />
    <path d="M1040,430 L1075,430 L1075,438 L1110,438" />
  </g>
  <g stroke="oklch(0.70 0.02 260)" stroke-width="1.3" fill="none" stroke-dasharray="4 4" marker-end="url(#arrow)">
    <path d="M880,160 L960,160 L960,272" />
  </g>

  <text x="516" y="134" class="lbl">phone OTP</text>
  <text x="516" y="246" class="lbl">HTTPS · Bearer ID token</text>
  <text x="828" y="518" class="lbl">asyncpg (pooled)</text>
  <text x="966" y="222" class="lbl" font-size="10">public keys</text>
  <text x="1046" y="306" class="lbl" font-size="10">presigned</text>
  <text x="1046" y="424" class="lbl" font-size="10">proxied fetch</text>

  <!-- ============ FOOTER NOTE ============ -->
  <rect x="40" y="580" width="1322" height="72" rx="10" fill="oklch(0.96 0.02 85)" stroke="oklch(0.78 0.06 85)" stroke-width="1" />
  <text x="62" y="606" class="noteTitle">Why a one-minute cold start is acceptable</text>
  <text x="62" y="627" class="note">Render's free instance sleeps after 15 minutes. For a synchronous app that would be fatal — but writes commit to the IndexedDB outbox and drain in the</text>
  <text x="62" y="644" class="note">background, retrying straight through the wake-up. The offline decision and the free-tier decision hold each other up; neither works alone.</text>

  <text x="700" y="690" class="subtitle" text-anchor="middle" font-size="12">Every backend change happens behind IStorageService. Components and feature services are untouched.</text>
  <text x="700" y="712" class="subtitle" text-anchor="middle" font-size="11" fill="oklch(0.60 0.02 260)">Free-tier figures verified September 2026 — re-verify before provisioning.</text>
</svg>
</div>
</x-dc>
</body>
</html>
