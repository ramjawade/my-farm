<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
  </style>
</helmet>
<div style="width:1020px;height:800px;background:oklch(0.97 0.005 260);display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding:20px">
<svg viewBox="0 0 980 760" width="980" height="760" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadowM" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10" />
    </filter>
    <marker id="arrowM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="oklch(0.45 0.02 260)" />
    </marker>
  </defs>
  <style>
    .title{font:700 25px 'IBM Plex Sans',sans-serif;fill:oklch(0.20 0.02 260)}
    .subtitle{font:400 13px 'IBM Plex Sans',sans-serif;fill:oklch(0.52 0.02 260)}
    .sect{font:700 13px 'IBM Plex Sans',sans-serif;letter-spacing:.6px;fill:oklch(0.42 0.14 265)}
    .stepno{font:700 15px 'IBM Plex Mono',monospace;fill:oklch(0.42 0.14 265)}
    .stepttl{font:600 12.5px 'IBM Plex Sans',sans-serif;fill:oklch(0.22 0.02 260)}
    .stepbody{font:400 11px 'IBM Plex Sans',sans-serif;fill:oklch(0.45 0.02 260)}
    .fname{font:600 10.5px 'IBM Plex Mono',monospace;fill:oklch(0.30 0.02 260)}
    .note{font:400 11px 'IBM Plex Sans',sans-serif;fill:oklch(0.42 0.02 260)}
    .noteTitle{font:700 12px 'IBM Plex Sans',sans-serif;fill:oklch(0.20 0.02 260)}
    .box{fill:oklch(1 0 0);stroke:oklch(0.88 0.01 260);stroke-width:1}
  </style>

  <text x="490" y="32" class="title" text-anchor="middle">Migration &amp; Offline Sync</text>
  <text x="490" y="54" class="subtitle" text-anchor="middle">localStorage lands in Postgres once; after that the outbox keeps the app writable with no network</text>

  <!-- ===== SECTION A ===== -->
  <text x="40" y="90" class="sect">ONE-TIME MIGRATION — runs on first authenticated login, behind a completion flag</text>

  <g filter="url(#shadowM)">
    <rect x="40" y="102" width="900" height="52" rx="8" class="box" />
    <rect x="40" y="164" width="900" height="52" rx="8" class="box" />
    <rect x="40" y="226" width="900" height="52" rx="8" class="box" />
    <rect x="40" y="288" width="900" height="52" rx="8" fill="oklch(0.97 0.025 25)" stroke="oklch(0.72 0.10 25)" stroke-width="1.5" />
    <rect x="40" y="350" width="900" height="52" rx="8" class="box" />
    <rect x="40" y="412" width="900" height="52" rx="8" class="box" />
  </g>

  <text x="64" y="134" class="stepno">1</text>
  <text x="94" y="124" class="stepttl">Detect the legacy keys</text>
  <text x="94" y="142" class="stepbody"><tspan class="fname">my_farm_${userId}_{activities, activity_expenses, crops, saved_farms}</tspan> plus the pre-migration keys migration.ts already handles</text>

  <text x="64" y="196" class="stepno">2</text>
  <text x="94" y="186" class="stepttl">Mint a UUIDv7 per record, seeded from its real createdAt</text>
  <text x="94" y="204" class="stepbody">Historical ordering survives the change of id format — the timestamp is carried into the new key, not discarded</text>

  <text x="64" y="258" class="stepno">3</text>
  <text x="94" y="248" class="stepttl">Build the old-id → new-id remap first</text>
  <text x="94" y="266" class="stepbody">Five incompatible formats exist today: <tspan class="fname">f-…</tspan>, <tspan class="fname">c-…</tspan>, a v4 uuid, <tspan class="fname">activity_…</tspan>, <tspan class="fname">expense_…</tspan> — all converge here</text>

  <text x="64" y="320" class="stepno">4</text>
  <text x="94" y="310" class="stepttl">Rewrite every reference through the remap — and fail loudly</text>
  <text x="94" y="328" class="stepbody"><tspan class="fname">fieldId · cropId · activityId · parentActivityId</tspan> — an unresolved reference stops the migration; it is never silently dropped</text>

  <text x="64" y="382" class="stepno">5</text>
  <text x="94" y="372" class="stepttl">Push through /sync/push in FK order</text>
  <text x="94" y="390" class="stepbody">The endpoint upserts by primary key, so a run interrupted halfway is safely resumable</text>

  <text x="64" y="444" class="stepno">6</text>
  <text x="94" y="434" class="stepttl">Verify, then set the completion flag</text>
  <text x="94" y="452" class="stepbody">Row counts and id sets must match. Weather is not migrated — it refetches.</text>

  <g stroke="oklch(0.60 0.02 260)" stroke-width="1.4" fill="none" marker-end="url(#arrowM)">
    <line x1="490" y1="154" x2="490" y2="163" />
    <line x1="490" y1="216" x2="490" y2="225" />
    <line x1="490" y1="278" x2="490" y2="287" />
    <line x1="490" y1="340" x2="490" y2="349" />
    <line x1="490" y1="402" x2="490" y2="411" />
  </g>

  <!-- ===== SECTION B ===== -->
  <text x="40" y="504" class="sect">ONGOING — the outbox loop</text>

  <g filter="url(#shadowM)">
    <rect x="40" y="518" width="200" height="88" rx="8" fill="oklch(0.96 0.04 85)" stroke="oklch(0.70 0.10 85)" stroke-width="1.5" />
    <rect x="290" y="518" width="200" height="88" rx="8" class="box" />
    <rect x="540" y="518" width="200" height="88" rx="8" class="box" />
    <rect x="790" y="518" width="150" height="88" rx="8" fill="oklch(0.96 0.03 155)" stroke="oklch(0.62 0.10 155)" stroke-width="1.5" />
  </g>

  <text x="140" y="546" class="stepttl" text-anchor="middle">Write lands locally</text>
  <text x="140" y="566" class="stepbody" text-anchor="middle">IndexedDB outbox</text>
  <text x="140" y="582" class="stepbody" text-anchor="middle">UI never waits on</text>
  <text x="140" y="596" class="stepbody" text-anchor="middle">the network</text>

  <text x="390" y="546" class="stepttl" text-anchor="middle">Drain on reconnect</text>
  <text x="390" y="566" class="stepbody" text-anchor="middle">batched POST /sync/push</text>
  <text x="390" y="582" class="stepbody" text-anchor="middle">exponential backoff,</text>
  <text x="390" y="596" class="stepbody" text-anchor="middle">per-item results</text>

  <text x="640" y="546" class="stepttl" text-anchor="middle">Pull the delta</text>
  <text x="640" y="566" class="stepbody" text-anchor="middle">GET /sync/pull?since=</text>
  <text x="640" y="582" class="stepbody" text-anchor="middle">tombstones included, so</text>
  <text x="640" y="596" class="stepbody" text-anchor="middle">deletes reach the client</text>

  <text x="865" y="546" class="stepttl" text-anchor="middle">Converged</text>
  <text x="865" y="566" class="stepbody" text-anchor="middle">last-write-wins</text>
  <text x="865" y="582" class="stepbody" text-anchor="middle">on updated_at,</text>
  <text x="865" y="596" class="stepbody" text-anchor="middle">server is the clock</text>

  <g stroke="oklch(0.60 0.02 260)" stroke-width="1.4" fill="none" marker-end="url(#arrowM)">
    <line x1="240" y1="562" x2="289" y2="562" />
    <line x1="490" y1="562" x2="539" y2="562" />
    <line x1="740" y1="562" x2="789" y2="562" />
  </g>
  <path d="M865,606 L865,628 L140,628 L140,607" stroke="oklch(0.70 0.02 260)" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#arrowM)" />
  <text x="502" y="644" class="note" text-anchor="middle" font-size="10.5">repeats whenever connectivity returns</text>

  <!-- ===== FOOTER NOTES ===== -->
  <rect x="40" y="662" width="440" height="80" rx="10" fill="oklch(0.96 0.02 265)" stroke="oklch(0.78 0.06 265)" stroke-width="1" />
  <text x="60" y="686" class="noteTitle">Idempotency is free</text>
  <text x="60" y="707" class="note">Because the client mints the id, the server upserts by primary</text>
  <text x="60" y="724" class="note">key — a replayed batch changes nothing. No dedupe table needed.</text>

  <rect x="500" y="662" width="440" height="80" rx="10" fill="oklch(0.96 0.02 85)" stroke="oklch(0.78 0.06 85)" stroke-width="1" />
  <text x="520" y="686" class="noteTitle">Why deletes are tombstones</text>
  <text x="520" y="707" class="note">A hard delete is invisible to a client that was offline when it</text>
  <text x="520" y="724" class="note">happened. <tspan class="fname">deleted_at</tspan> lets the deletion propagate on next pull.</text>
</svg>
</div>
</x-dc>
</body>
</html>
